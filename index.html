        delete: s.wt ? `git worktree remove ../${s.wt.path}` : `git branch -D ${b}`,
      }[kind];
    }
    // Whether an agent can pick branch b up as it stands ('' when it can): in its worktree when nobody works there,
    // otherwise checked out into a new one. Work on main starts on a branch of its own.
    function takeState(p, b) {
      if (b === 'main') return '不在 main 上直接改';
      if (p.merged.has(b)) return '已经合并';
      const wt = p.worktrees.find(w => w.branch === b), a = wt?.agents.find(x => x.harness !== 'human' && !x.role);
      if (a) return a.status === 'done' ? `在 ${HARNESS[a.harness].name} 的会话里继续` : `${HARNESS[a.harness].name} 还在工作`;
      if (!wt && checkoutOf(p, b)) return '子 agent 的 worktree 检出了它';
      return '';
    }
    // Linked worktrees sit next to the repository and take the branch's last part: orbit + claude/dark-mode → orbit-dark-mode.
    function folderFor(p, b) {
      const stem = `${p.name}-${b.split('/').filter(Boolean).pop() || 'task'}`;
      let f = stem, n = 2;
      while (p.worktrees.some(w => w.path === f)) f = `${stem}-${n++}`;
      return f;
    }
    // The right-click menu: what it acts on at the top (a branch and its worktree, or a commit), then the actions.
    // One that can't run right now is greyed, with the reason where its hint would be.
    function menuHTML(p, m) {
      const mono = text => `<span class="mono">${text}</span>`;
      // Starting a task: from here on a new branch, or carrying on with a branch nobody is working on.
      const task = (kind, label, hint, why, cmd) => `<button class="mi" role="menuitem" data-task="${kind}"`
        + (why ? ' aria-disabled="true">' : cmd ? ` title="${esc(cmd)}">` : '>')
        + `<span>${label}</span><span class="mi-r">${why ? esc(why) : hint}</span></button>`;
      const fork = base => base ? `git worktree add -b <新分支> ../${p.name}-<名字> ${sha(base)}` : '';
      if (m.c) {
        const c = p.commits.find(x => x.id === m.c);
        return `<div class="menu-h">${mono(sha(m.c))}<span class="menu-msg">${esc(c ? c.msg : '')}</span></div>`
          + task('new', '从这个提交开新任务…', '新 worktree', c ? '' : '提交已经不在了', fork(m.c));
      }
      const b = m.b, s = gitState(p, b), head = headOf(p, b), take = takeState(p, b);
      const owner = s.wt?.agents.find(a => a.harness !== 'human')?.harness;
      const color = ui.mode === 'branch' ? branchColor(p, b) : b === 'main' ? TRUNK : owner ? HARNESS[owner].color : QUIET;
      const item = (kind, label, hint, cls = '') => `<button class="mi${cls}" role="menuitem" data-git="${kind}"`
        + (s[kind] ? ' aria-disabled="true">' : ` title="${esc(gitCmd(p, kind, b, s))}">`)
        + `<span>${label}</span><span class="mi-r">${s[kind] ? esc(s[kind]) : hint}</span></button>`;
      return `<div class="menu-h">${pill(b, color, s.wt && s.wt.path)}<span>${s.wt ? esc(s.wt.path) : '没有 worktree'}</span></div>`
        + task('new', '从这里开新任务…', '新 worktree', head ? '' : '还没有提交', fork(head))
        + task('take', '让 agent 接着做…', s.wt ? `在 ${esc(s.wt.path)} 里` : '检出到新 worktree', take, s.wt ? '' : `git worktree add ../${folderFor(p, b)} ${b}`)
        + '<div class="menu-sep" role="separator"></div>'
        + item('commit', '提交', s.wt ? mono(`<span class="add">+${s.wt.add}</span> <span class="del">−${s.wt.del}</span>`) : '')
        + item('push', s.diverged ? '强制推送' : '推送', s.diverged ? '覆盖 origin' : s.upstream ? mono(`↑${s.ahead}`) : '首次推送')
        + item('merge', '合并到 main', p.prs[b] ? mono(`#${p.prs[b]}`) : '')
        + item('rebase', '变基到 main', mono(`↓${s.behind}`))
        + '<div class="menu-sep" role="separator"></div>'
        + (m.confirm
          ? item('delete', '确认删除分支', `丢掉 ${s.own} 个提交`, ' danger on')
          : item('delete', s.wt ? '移除 worktree' : '删除分支', s.wt ? '分支保留' : `${s.own} 个提交`, ' danger'));
    }

    function glyph(h, x, y, size, color) {
      if (h === 'claude') {
        const r = size * .3;
        let d = '';
        for (const deg of [0, 45, 90, 135]) {
          const dx = Math.cos(deg * Math.PI / 180) * r, dy = Math.sin(deg * Math.PI / 180) * r;
          d += `M${(x - dx).toFixed(2)} ${(y - dy).toFixed(2)}L${(x + dx).toFixed(2)} ${(y + dy).toFixed(2)}`;
        }
        return `<path d="${d}" stroke="${color}" stroke-width="${(size / 11).toFixed(2)}" stroke-linecap="round"/>`;
      }
      const [text, scale] = { codex: ['&gt;_', .5], pi: ['π', .74], human: ['你', .52] }[h];
      return `<text class="gl-${h}" x="${x}" y="${y}" fill="${color}" font-size="${(size * scale).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${text}</text>`;
    }
    const avatar = h => h === 'human'
      ? '<span class="av human">你</span>'
      : `<span class="av" style="--c:${HARNESS[h].color}"><svg viewBox="0 0 16 16">${glyph(h, 8, 8, 16, HARNESS[h].color)}</svg></span>`;
    // wt: the worktree this branch is checked out in, if any.
    const pill = (b, color, wt) => `<span class="pill" style="--c:${color}" title="${esc(b)}${wt ? ` · 检出在 worktree ${esc(wt)}` : ''}">${wt ? FOLDER : ''}<span>${esc(b)}</span></span>`;
    const diff = wt => `<span class="diff" title="未提交的改动"><span class="add">+${wt.add}</span><span class="del">−${wt.del}</span></span>`;
    const badge = (x, y, color, d) => `<circle cx="${x}" cy="${y}" r="5" fill="${color}" stroke="${NOW}" stroke-width="1.5"/><path d="${d}" fill="none" stroke="${NOW}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    const wtMark = (x, y, color, ghost) => `<rect x="${x - 5.5}" y="${y - 5.5}" width="11" height="11" rx="3" fill="${NOW}" stroke="${color}" stroke-width="1.6"${ghost ? ' stroke-dasharray="2.5 2"' : ''}/>`;

    function bead(r, x, y, ph) {
      if (r.kind === 'sub') {
        const color = HARNESS[r.agent.harness].color;
        return r.sub.status === 'done'
          ? `<circle cx="${x}" cy="${y}" r="4" fill="${NOW}" stroke="#666c75" stroke-width="1.5"/>`
          : `<circle cx="${x}" cy="${y}" r="6.5" fill="${NOW}"/><circle class="beat" style="animation-delay:${ph(1400)}" cx="${x}" cy="${y}" r="4.5" fill="${color}"/>`;
      }
      const a = r.agent, color = HARNESS[a.harness].color, R = r.lead ? 11 : 9;
      if (a.harness === 'human') return `<circle cx="${x}" cy="${y}" r="10" fill="${color}" stroke="${NOW}" stroke-width="3"/>${glyph('human', x, y, 20, NOW)}`;
      // The agent of a task you are still writing: an outline of its avatar.
      if (a.status === 'draft') return `<circle cx="${x}" cy="${y}" r="${R}" fill="${NOW}" stroke="${color}" stroke-width="1.6" stroke-dasharray="3 2.5"/><g opacity=".8">${glyph(a.harness, x, y, R * 2, color)}</g>`;
      const quiet = a.status === 'done' || a.status === 'idle';
      let s = '';
      if (a.status === 'waiting') s += `<circle class="halo" style="animation-delay:${ph(1800)}" cx="${x}" cy="${y}" r="${R + 1}" fill="none" stroke="${WAITING}" stroke-width="2"/>`;
      s += `<circle cx="${x}" cy="${y}" r="${R}" fill="${NOW}" stroke="${quiet ? '#5c626b' : color}" stroke-width="1.6"/>`;
      if (a.status === 'running') {
        const rr = R + 4, C = 2 * Math.PI * rr;
        s += `<circle class="spin" style="animation-delay:${ph(1600)}" cx="${x}" cy="${y}" r="${rr}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="${(C * .22).toFixed(1)} ${C.toFixed(1)}"/>`;
      }
      s += glyph(a.harness, x, y, R * 2, quiet ? '#9097a0' : color);
      const bx = x + R * .75;
      if (a.status === 'done') s += badge(bx, y + R * .75, DONE, `M${bx - 2} ${y + R * .75}l1.4 1.4 2.6-2.8`);
      if (a.status === 'waiting') s += badge(bx, y - R * .75, WAITING, `M${bx} ${y - R * .75 - 2.2}v2.3m0 1.9v.1`);
      return s;
    }

    // Rows and lanes for one project. compact keeps the "now" band plus only the recent history it hangs off.
    // hold: the pointer is over the band (or a right-click menu from it is open), so its worktrees keep their order.
    function layout(p, compact, hold) {
      const map = new Map(p.commits.map(c => [c.id, c]));
      p.commits.forEach(c => branchColor(p, c.branch));
      allSubs(p).forEach(s => s.branch && branchColor(p, s.branch));

      // The task you are writing, if it is in this project: its outline goes in the band (see ghostOf()).
      // fresh: its branch, when that is a new one that doesn't exist yet.
      const g = ghostOf(p), fresh = g?.wt.ghost && ui.draft.kind === 'new' ? g.wt.branch : null;

      // Who works on each branch right now: the first agent of its worktree, or the agent that spawned the sub-branch.
      const owner = new Map();
      for (const wt of p.worktrees) {
        if (wt.agents.length) owner.set(wt.branch, wt.agents[0].harness);
        for (const a of wt.agents) for (const s of a.subagents || []) if (s.branch) owner.set(s.branch, a.harness);
      }
      if (fresh) owner.set(fresh, g.agent.harness);
      const laneColor = b => ui.mode === 'branch' ? (b === fresh ? nextColor(p) : branchColor(p, b))
        : b === 'main' ? TRUNK
        : owner.has(b) && owner.get(b) !== 'human' ? HARNESS[owner.get(b)].color : QUIET;

      // Rows: the "now" band (worktrees sorted by who needs you first, each heading its agents), then history newest-first.
      // Held, the band keeps the order it was last shown in and re-sorts once the pointer has left; new worktrees go on top.
      // The outline of a task you are writing goes on top as well; an outlined agent in an existing worktree doesn't move it.
      const rank = wt => wt.ghost ? -1 : wt.merged ? 6 : wt.agents.length ? Math.min(...wt.agents.map(a => STATUS[a.status][1])) : 5;
      const team = wt => g && g.wt === wt && !wt.ghost ? [...wt.agents, g.agent] : wt.agents;
      const last = p.order || [], rows = [];
      const wts = (g?.wt.ghost ? [...p.worktrees, g.wt] : p.worktrees)
        .filter(wt => ui.wts || team(wt).length).map(wt => ({ wt, rank: rank(wt), at: last.indexOf(wt.id) }));
      wts.sort(hold ? (a, b) => a.at - b.at : (a, b) => a.rank - b.rank);
      p.order = wts.map(x => x.wt.id);
      wts.forEach(({ wt }) => {
        if (ui.wts) rows.push({ kind: 'wt', wt, branch: wt.branch, height: WT_H, ghost: !!wt.ghost });
        team(wt).forEach((agent, i) => {
          rows.push({ kind: 'agent', wt, agent, lead: i === 0, branch: wt.branch, hz: agent.harness, height: AGENT_H, ghost: !!agent.ghost });
          if (ui.subs) for (const sub of agent.subagents || []) {
            rows.push({ kind: 'sub', wt, agent, sub, branch: sub.branch || wt.branch, hz: agent.harness, height: SUB_H });
          }
        });
      });
      const nowCount = rows.length;

      // Compact: start history at the oldest commit something in the "now" band sits on, and show at least RECENT commits.
      let from = 0;
      if (compact) {
        const index = new Map(p.commits.map((c, i) => [c.id, i]));
        const anchors = [...new Set(rows.map(r => r.branch))].map(b => index.get(headOf(p, b))).filter(i => i !== undefined);
        from = Math.max(0, Math.min(p.commits.length - RECENT, ...anchors));
      }
      for (let i = p.commits.length - 1; i >= from; i--) {
        const c = p.commits[i];
        rows.push({ kind: 'commit', commit: c, branch: c.branch, hz: c.author, height: ROW_H });
      }
      let y = 0;
      rows.forEach((r, i) => {
        r.key = keyOf(p, r);
        r.id = r.kind === 'commit' ? `c:${r.commit.id}` : r.key; // which row this is, for motion (key is what it acts on)
        if (i === nowCount && nowCount) y += GAP;
        r.y = y + r.height / 2;
        y += r.height;
      });
      const band = nowCount ? rows[nowCount - 1].y + rows[nowCount - 1].height / 2 : 0; // height of the "now" band
      const bottom = from ? y + MORE_H : y;
      const rowOf = new Map();
      rows.forEach((r, i) => r.kind === 'commit' && rowOf.set(r.commit.id, i));

      // Lanes: each branch occupies the rows between its fork point and its newest row; reuse lanes that are free.
      // A branch whose older commits are hidden keeps its lane down to the bottom edge.
      const span = new Map();
      const touch = (b, i) => {
        const s = span.get(b);
        if (s) { s.top = Math.min(s.top, i); s.bottom = Math.max(s.bottom, i); } else span.set(b, { top: i, bottom: i });
      };
      rows.forEach((r, i) => {
        touch(r.branch, i);
        if (r.kind === 'commit') {
          r.commit.parents.forEach((pid, k) => {
            const par = map.get(pid);
            if (!par) return;
            if (!rowOf.has(pid)) { if (k === 0) touch(r.branch, rows.length); return; }
            if (par.branch === r.branch) return;
            if (k === 0) touch(r.branch, rowOf.get(pid));
            else touch(par.branch, i);
          });
        } else {
          const head = headOf(p, r.branch);
          if (rowOf.has(head)) touch(r.branch, rowOf.get(head));
        }
      });
      const lane = new Map([['main', 0]]), taken = [[span.get('main') || { top: 0, bottom: rows.length }]];
      [...span.keys()].filter(b => b !== 'main')
        .sort((a, b) => span.get(b).bottom - span.get(a).bottom || span.get(a).top - span.get(b).top)
        .forEach(b => {
          const s = span.get(b);
          let l = (lane.get(parentOf(p, b, map)) ?? 0) + 1;
          while ((taken[l] || []).some(o => s.top <= o.bottom && o.top <= s.bottom)) l++;
          lane.set(b, l);
          (taken[l] ||= []).push(s);
        });
      const gx = PAD * 2 + (Math.max(...lane.values()) + 1) * LANE_W;
      return { p, compact, map, owner, laneColor, rows, nowCount, rowOf, lane, gx, y, bottom, band, hidden: from };
    }

    // The SVG: edges, then commit dots, then worktree marks and agent beads on top. Mid-slide (m), every position is taken
    // part-way between where it was drawn and where it is going, so lanes bend along with their rows; new rows fade in.
    function drawLanes(L, sec, m) {
      const { p, map, owner, laneColor, rows, nowCount, rowOf, lane, gx, bottom } = L;
      const left = m ? 1 - m.e : 0, now = performance.now();
      const X = b => laneX(lane.get(b)) + snap((m?.dX.get(b) || 0) * left);
      const Y = r => r.y + snap((m?.dY.get(r.id) || 0) * left); // the same offset its row is moved by
      const alpha = r => m && m.born.has(r.id) ? m.e : 1;
      const pin = ui.pinned && ui.pinned.p === p.id ? focusSet(p, ui.pinned.b) : null;
      const on = b => pin && pin.has(b) ? ' on' : '';
      // Fresh commits and subagents pop in; a redraw mid-pop carries on from where the pop had got to.
      const pop = x => {
        if (x.fresh && !popAt.has(x)) popAt.set(x, now);
        const t = now - (popAt.get(x) ?? -1e9);
        return t < 450 ? [' pop', ` style="animation-delay:-${Math.round(t)}ms"`] : ['', ''];
      };
      const dotColor = c => ui.mode === 'branch' ? branchColor(p, c.branch) : c.author === 'human' ? HUMAN_DOT : HARNESS[c.author].color;
      const ph = period => `-${(now % period / 1000).toFixed(3)}s`;
      const path = (d, color, b, h, o = {}) =>
        `<path data-b="${esc(b)}" class="${off(h)}${on(b)}" d="${d}" fill="none" stroke="${color}" stroke-width="${o.width || 2}" stroke-linecap="round"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}${o.opacity ? ` opacity="${o.opacity}"` : ''}/>`;
      const curve = (x1, y1, x2, y2) => { const c = (y1 + y2) / 2; return `C${x1} ${c} ${x2} ${c} ${x2} ${y2}`; };
      let edges = '', nodes = '', beads = '';

      rows.forEach(r => {
        if (r.kind !== 'commit') return;
        const c = r.commit, x1 = X(c.branch), y1 = Y(r);
        c.parents.forEach((pid, j) => {
          const par = map.get(pid);
          if (!par) return;
          if (!rowOf.has(pid)) {
            // The parent is in the hidden part of history: the lane runs off the bottom and fades out.
            if (j === 0) edges += path(`M${x1} ${y1}V${bottom}`, laneColor(c.branch), c.branch, owner.get(c.branch));
            return;
          }
          const x2 = X(par.branch), y2 = Y(rows[rowOf.get(pid)]);
          if (par.branch === c.branch) {
            edges += path(`M${x1} ${y1}V${y2}`, laneColor(c.branch), c.branch, owner.get(c.branch));
          } else if (j === 0) {
            const cy = Math.max(y1, y2 - ROW_H);
            edges += path(`M${x1} ${y1}V${cy}${curve(x1, cy, x2, y2)}`, laneColor(c.branch), c.branch, owner.get(c.branch));
          } else {
            const cy = Math.min(y2, y1 + ROW_H);
            edges += path(`M${x1} ${y1}${curve(x1, y1, x2, cy)}V${y2}`, laneColor(par.branch), par.branch, owner.get(par.branch));
          }
        });
        const col = dotColor(c), merge = c.parents.length > 1, [pc, ps] = pop(c), a = pc ? 1 : alpha(r);
        nodes += `<circle data-b="${esc(c.branch)}" class="${pc}${off(c.author)}${on(c.branch)}"${ps}${a < 1 ? ` opacity="${a.toFixed(2)}"` : ''} cx="${x1}" cy="${y1}" r="${merge ? 3.8 : 4.3}" fill="${merge ? PAGE : col}" stroke="${merge ? col : PAGE}" stroke-width="2"/>`;
      });

      // The "now" band. While a worktree rises past others, the marks of the rows sliding down go on the lower layer,
      // so the rising rows cover them along with their text.
      const band = rows.slice(0, nowCount), lists = new Map(), low = { edges: '', beads: '' }, high = { edges: '', beads: '' };
      const layer = r => m?.cross && (m.dY.get(r.id) || 0) < 0 ? low : high;
      // Each worktree's rows share its branch lane; a dashed line drops to the commit the worktree sits on.
      band.forEach(r => { if (!lists.has(r.branch)) lists.set(r.branch, []); lists.get(r.branch).push(r); });
      for (const [b, list] of lists) {
        const x = X(b), color = laneColor(b), h = owner.get(b), to = layer(list[0]);
        // Down to the outlined rows of a task you are writing, the lane is dashed.
        for (let i = 1; i < list.length; i++) to.edges += path(`M${x} ${Y(list[i - 1])}V${Y(list[i])}`, color, b, h, list[i].ghost ? { dash: '3 4', width: 1.6 } : {});
        const head = headOf(p, b);
        if (!rowOf.has(head)) continue;
        const ly = Y(list[list.length - 1]), hb = map.get(head).branch, y2 = Y(rows[rowOf.get(head)]);
        const cy = Math.max(ly, y2 - ROW_H);
        const d = hb === b ? `M${x} ${ly}V${y2}` : `M${x} ${ly}V${cy}${curve(x, cy, X(hb), y2)}`;
        to.edges += path(d, color, b, h, { dash: '2 5', width: 1.6 });
      }
      // A subagent with its own worktree hangs off its parent agent.
      band.forEach(r => {
        if (r.kind !== 'sub' || !r.sub.branch) return;
        const pr = band.find(o => o.kind === 'agent' && o.agent === r.agent);
        const xa = X(pr.branch) + (pr.lead ? 11 : 9) + 2, xs = X(r.branch), ya = Y(pr);
        layer(r).edges += path(`M${xa} ${ya}C${xs} ${ya} ${xs} ${ya} ${xs} ${Y(r) - 7}`, HARNESS[r.agent.harness].color, r.branch, r.hz, { dash: '1 4', width: 1.5, opacity: .9 });
      });
      band.forEach(r => {
        const a = alpha(r), faded = s => a < 1 ? `<g opacity="${a.toFixed(2)}">${s}</g>` : s;
        if (r.kind === 'wt') {
          layer(r).beads += `<g data-b="${esc(r.branch)}" class="${dim(r)}${on(r.branch)}">${faded(wtMark(X(r.branch), Y(r), r.wt.merged ? RETIRED : laneColor(r.branch), r.ghost))}</g>`;
          return;
        }
        const [pc, ps] = r.kind === 'sub' ? pop(r.sub) : ['', ''], mark = bead(r, X(r.branch), Y(r), ph);
        layer(r).beads += `<g data-b="${esc(r.branch)}" class="${pc}${off(r.hz)}${on(r.branch)}"${ps}>${pc ? mark : faded(mark)}</g>`;
      });

      const [under, top] = sec.querySelectorAll('.lanes');
      for (const svg of [under, top]) {
        svg.setAttribute('width', gx);
        svg.setAttribute('height', bottom);
        svg.setAttribute('viewBox', `0 0 ${gx} ${bottom}`);
      }
      setHTML(under, low.edges + low.beads);
      top.innerHTML = edges + high.edges + nodes + high.beads;
    }

    // m: the slide from what was on screen to this layout (see moves()), or null to draw it in place.
    function paint(L, sec, m) {
      const { p, compact, map, laneColor, rows, nowCount, gx, y, bottom, hidden } = L;
      const g = sec.querySelector('.graph');
      const nowEl = sec.querySelector('.now'), histEl = sec.querySelector('.history');
      const fade = hidden ? `linear-gradient(to bottom, #000 ${y}px, transparent ${bottom}px)` : '';
      for (const svg of sec.querySelectorAll('.lanes')) svg.style.maskImage = svg.style.webkitMaskImage = fade;
      // A row that slides starts where it was (frame() walks it home); a new one fades in, unless it is fresh and pops.
      const motion = (id, fresh = false) => {
        const d = m?.dY.get(id);
        return [(d ? ` moving${d > 0 ? ' rise' : ''}` : '') + (m?.born.has(id) && !fresh ? ' fade' : ''), d ? `;transform:translateY(${snap(d)}px)` : ''];
      };

      // Rows.
      const tips = new Map();
      for (const c of p.commits) if (!p.merged.has(c.branch)) tips.set(c.branch, c.id);
      const tipsAt = new Map();
      for (const [b, id] of tips) { if (!tipsAt.has(id)) tipsAt.set(id, []); tipsAt.get(id).push(b); }
      // A finished agent's next step is a look at what it changed; the merge sits under that, in the panel.
      const reviewBtn = a => `<button class="btn merge" data-act="review" data-id="${a.id}" title="看完改动再决定合并">查看改动</button>`;
      const draft = ui.draft?.p === p.id ? ui.draft : null;
      const rowHTML = r => {
        const fresh = r.kind === 'commit' ? r.commit.fresh : r.kind === 'sub' && r.sub.fresh;
        const status = r.kind === 'agent' ? ` is-${r.agent.status}` : r.kind === 'wt' && r.wt.merged ? ' is-merged' : '';
        // Agent and subagent rows open their conversation; the open one is marked. Commit rows can be spotlighted from it.
        // While you write a task, its outlined agent is the one marked, and the commit it forks off is lit.
        const chat = ui.chat;
        const sel = r.ghost && r.kind === 'agent' || chat && (r.kind === 'agent' ? !chat.s && chat.a === r.agent : r.kind === 'sub' && chat.s === r.sub);
        const spot = r.kind === 'commit' && ui.spot && ui.spot.c === r.commit && Date.now() < ui.spot.until;
        const from = r.kind === 'commit' && draft?.kind === 'new' && draft.base === r.commit.id;
        const ids = r.ghost ? ' data-draft' : r.kind === 'commit' ? ` data-c="${r.commit.id}"`
          : r.kind === 'sub' ? ` data-a="${r.agent.id}" data-s="${r.sub.id}"`
          : r.kind === 'agent' && r.agent.harness !== 'human' ? ` data-a="${r.agent.id}"` : '';
        const ctx = ui.menu && ui.menu.p === p.id && ui.menu.key === r.key; // the row the right-click menu belongs to
        const [mc, ms] = motion(r.id, !!fresh);
        const open = `<div class="row ${r.kind === 'wt' ? 'wt-row' : r.kind}${status}${dim(r)}${fresh ? ' fresh' : ''}${r.ghost ? ' ghost' : ''}${sel ? ' sel' : ''}${spot ? ' spot' : ''}${from ? ' from' : ''}${ctx ? ' ctx' : ''}${mc}"`
          + ` data-b="${esc(r.branch)}"${ids} data-key="${esc(r.key)}" style="height:${r.height}px${ms}">`;
        if (r.kind === 'wt') {
          // Name, branch, PR and how far behind main on the left; uncommitted changes and lifecycle on the right.
          const wt = r.wt;
          const right = wt.ghost ? '<span class="clean">待创建</span>' : wt.merged
            ? `<span class="state done">已合并到 main</span><button class="btn" data-act="prune" data-id="${wt.id}">移除 worktree</button>`
            : wt.agents.length
              ? (wt.add + wt.del ? diff(wt) : '<span class="clean">无改动</span>')
              : (wt.add + wt.del ? diff(wt) : '') + '<span class="idle">没有 agent</span>';
          return `${open}<div class="main"><div class="l1">
              <span class="wt-name" title="${esc(fullPath(p, wt))}">${FOLDER}<span>${esc(wt.path)}</span></span>
              ${wt.primary ? '<span class="role">主工作区</span>' : ''}
              ${pill(wt.branch, wt.merged ? RETIRED : laneColor(wt.branch))}
              ${p.prs[wt.branch] ? `<span class="pr">#${p.prs[wt.branch]}</span>` : ''}${wt.merged ? '' : behind(p, wt.branch, map)}
            </div></div><div class="meta">${right}</div></div>`;
        }
        if (r.kind === 'commit') {
          const c = r.commit;
          const pills = (tipsAt.get(c.id) || []).map(b => pill(b, laneColor(b), ui.wts && checkoutOf(p, b))).join('')
            + (p.tags[c.id] || []).map(t => `<span class="pill tag">${esc(t)}</span>`).join('');
          return `${open}<div class="main"><div class="l1">${pills}<span class="msg">${esc(c.msg)}</span></div></div>
            <span class="author" title="${HARNESS[c.author].name}${c.sub ? ' · ' + esc(c.sub) : ''}">${avatar(c.author)}</span>
            <span class="time">${age(c.ts)}</span><span class="sha">${sha(c.id)}</span></div>`;
        }
        if (r.kind === 'sub') {
          const s = r.sub, done = s.status === 'done';
          return `${open}<div class="main"><div class="l1"><span class="tree"></span>
            <span class="sub-name" style="color:${done ? 'var(--muted)' : HARNESS[r.agent.harness].color}">${esc(s.name)}</span>
            ${done ? '<span class="state done">完成</span>' : ''}<span class="act">${esc(s.activity)}</span></div></div>
            <div class="meta">${s.branch ? pill(s.branch, laneColor(s.branch)) + `<span class="wt">${FOLDER}${esc(s.path)}</span>` : ''}</div></div>`;
        }
        const { agent: a, wt, lead } = r, h = HARNESS[a.harness];
        // With worktree rows on, branch / PR / path / diff live on the worktree row instead of the lead agent.
        const meta = lead && !ui.wts ? [
          pill(wt.branch, laneColor(wt.branch)),
          p.prs[wt.branch] ? `<span class="pr">#${p.prs[wt.branch]}</span>` : '',
          behind(p, wt.branch, map),
          `<span class="wt">${FOLDER}${esc(wt.path)}</span>`,
          wt.add + wt.del ? diff(wt) : '',
        ].join('') : '';
        if (a.harness === 'human') {
          return `${open}<div class="main"><div class="l1"><span class="who">你</span>${ui.wts ? '<span class="task">在这里</span>' : ''}</div></div><div class="meta">${meta}</div></div>`;
        }
        if (a.status === 'draft') {
          return `${open}<div class="main">
              <div class="l1"><span class="who" style="color:${h.color}">${h.name}</span><span class="state draft">新任务</span>
                <span class="task${a.task ? '' : ' empty'}">${esc(a.task || '还没写任务')}</span></div>
              <div class="l2"><span class="note-l">在右侧写下任务，Enter 开始</span></div>
            </div><div class="meta">${meta}</div></div>`;
        }
        const time = a.status === 'running' || a.status === 'waiting' ? ` <em>${dur(a.elapsed)}</em>` : '';
        const line2 = a.status === 'waiting'
          ? `<span class="ask">${esc(a.activity)}</span><button class="btn allow" data-act="allow" data-id="${a.id}">允许</button><button class="btn" data-act="deny" data-id="${a.id}">拒绝</button>`
          : `<span class="act">${esc(a.activity)}</span>${a.status === 'done' && lead ? reviewBtn(a) : ''}`;
        return `${open}<div class="main">
            <div class="l1"><span class="who" style="color:${h.color}">${h.name}</span>${a.role ? `<span class="role">${a.role}</span>` : ''}
              <span class="state ${a.status}"${a.status === 'running' ? ` style="color:${h.color}"` : ''}>${STATUS[a.status][0]}${time}</span>
              <span class="task">${esc(a.task)}</span></div>
            <div class="l2">${line2}</div>
          </div><div class="meta">${meta}</div></div>`;
      };

      const linked = p.worktrees.length + allSubs(p).filter(s => s.branch).length;
      const stats = [['waiting', WAITING], ['running', '#d5d8dd'], ['done', DONE]]
        .map(([s, c]) => { const n = agentCount([p], s); return n ? `<span><i style="background:${c}"></i>${n} ${STATUS[s][0]}</span>` : ''; })
        .join('') + `<span>${linked} 个 worktree</span>`;
      sec.querySelector('.phead').innerHTML = (compact ? `<button class="pname" data-go="${p.id}" title="只看 ${esc(p.name)}">${esc(p.name)}</button>` : `<span class="pname">${esc(p.name)}</span>`)
        + `<span class="ppath">${esc(p.path)}</span><span class="pstats">${stats}</span>`
        + `<button class="pnew" data-new title="从 main 的最新提交开新任务">${PLUS}新任务</button>`;

      // Mid-slide the gutter and the band's background start from where they were too.
      g.style.setProperty('--gx', snap(gx + (m?.dGx || 0)) + 'px');
      nowEl.style.setProperty('--lag', snap(-(m?.dBand || 0)) + 'px');
      nowEl.hidden = !nowCount;
      histEl.style.marginTop = nowCount ? GAP + 'px' : '0';
      nowEl.innerHTML = rows.slice(0, nowCount).map(rowHTML).join('');
      const [mc, ms] = motion('more');
      histEl.innerHTML = rows.slice(nowCount).map(rowHTML).join('')
        + (hidden ? `<div class="row more${mc}" data-key="more" style="height:${MORE_H}px${ms}">更早的 ${hidden} 个提交<button class="link" data-go="${p.id}">查看完整历史</button></div>` : '');
      // The rows that slide, each with how far it has to go; frame() moves them along.
      if (m) Object.assign(m, { g, nowEl, els: [...sec.querySelectorAll('.row.moving')].map(el => [el, m.dY.get(el.dataset.c ? `c:${el.dataset.c}` : el.dataset.key)]) });
      drawLanes(L, sec, m);
    }

    function render() {
      stale = false;
      const list = scope(), compact = ui.project === 'all';
      const key = list.map(p => p.id).join(' ');
      root.classList.toggle('cols', compact);
      if (root.dataset.scope !== key) {
        root.dataset.scope = key;
        root.innerHTML = list.map(p => `<section class="project" data-p="${p.id}"><div class="phead"></div><div class="graph"><svg class="lanes sunk"></svg><svg class="lanes top"></svg><div class="now"></div><div class="history"></div></div></section>`).join('');
        shown.clear(); // new columns appear in place
      }
      // Rows slide to new places, unless motion is reduced or nobody is looking.
      const motion = !document.hidden && !matchMedia('(prefers-reduced-motion: reduce)').matches;
      held = heldProject();
      for (const p of list) {
        const sec = root.querySelector(`.project[data-p="${p.id}"]`);
        const L = layout(p, compact, held === p.id || ui.menu?.p === p.id);
        p.gutter = Math.max(p.gutter || 0, L.gx); // widest lane gutter so far, so column widths do not jump as lanes come and go
        const was = shown.get(p.id), m = motion && was ? moves(was, L) : null;
        paint(L, sec, m);
        shown.set(p.id, { sec, L, m });
        if (m) raf ||= requestAnimationFrame(frame);
      }
      // Side by side, each column gets the room its lanes need plus the same text width, so busy repos are not squeezed.
      root.style.gridTemplateColumns = compact ? list.map(p => `minmax(${p.gutter + 260}px, ${p.gutter + 340}fr)`).join(' ') : '';
      renderBar();
      for (const p of state.projects) {
        p.commits.forEach(c => { c.fresh = false; });
        allSubs(p).forEach(s => { s.fresh = false; });
      }
      applyFocus();
      renderChat();
      renderLegend();
    }

    // Where everything of a project is on screen right now, part-way through a slide if one is running.
    function shownAt(s, now) {
      const { L, m } = s, left = m ? 1 - ease(Math.min(1, (now - m.start) / MOVE_MS)) : 0;
      const ys = new Map(), xs = new Map();
      for (const r of L.rows) ys.set(r.id, r.y + (m?.dY.get(r.id) || 0) * left);
      if (L.hidden) ys.set('more', L.y + MORE_H / 2 + (m?.dY.get('more') || 0) * left);
      for (const [b, l] of L.lane) xs.set(b, laneX(l) + (m?.dX.get(b) || 0) * left);
      return { ys, xs, band: L.band + (m?.dBand || 0) * left, gx: L.gx + (m?.dGx || 0) * left };
    }
    // The slide from what is on screen to a new layout: rows that move (dY), lanes that shift (dX), rows that are new,
    // and the band's height and gutter width. null when nothing moves.
    function moves(s, L) {
      const now = performance.now(), from = shownAt(s, now), near = (a, b) => Math.abs(a - b) < .5;
      const m = { start: now, e: 0, dY: new Map(), dX: new Map(), born: new Set(), dBand: 0, dGx: 0, els: [] };
      for (const r of L.rows) {
        const o = from.ys.get(r.id);
        if (o === undefined) m.born.add(r.id); else if (!near(o, r.y)) m.dY.set(r.id, o - r.y);
      }
      const om = from.ys.get('more'), ym = L.y + MORE_H / 2;
      if (L.hidden && om !== undefined && !near(om, ym)) m.dY.set('more', om - ym);
      for (const [b, l] of L.lane) {
        const o = from.xs.get(b);
        if (o !== undefined && !near(o, laneX(l))) m.dX.set(b, o - laneX(l));
      }
      if (from.band && L.band && !near(from.band, L.band)) m.dBand = from.band - L.band;
      if (!near(from.gx, L.gx)) m.dGx = from.gx - L.gx;
      // Rows in the band pass each other: some rise while others sink.
      const band = L.rows.slice(0, L.nowCount).map(r => m.dY.get(r.id) || 0);
      m.cross = band.some(d => d > 0) && band.some(d => d < 0);
      return m.dY.size || m.dX.size || m.born.size || m.dBand || m.dGx ? m : null;
    }
    // One step of every slide in progress: rows, the band's background, the gutter and the lanes move together.
    function frame() {
      raf = 0;
      const now = performance.now();
      for (const s of shown.values()) {
        const m = s.m;
        if (!m) continue;
        const t = Math.min(1, (now - m.start) / MOVE_MS);
        m.e = ease(t);
        const left = 1 - m.e;
        for (const [el, d] of m.els) el.style.transform = left ? `translateY(${snap(d * left)}px)` : '';
        if (m.dBand) m.nowEl.style.setProperty('--lag', snap(-m.dBand * left) + 'px');
        if (m.dGx) m.g.style.setProperty('--gx', snap(s.L.gx + m.dGx * left) + 'px');
        if (t === 1) {
          for (const [el] of m.els) el.classList.remove('moving', 'rise');
          s.m = null;
        }
        drawLanes(s.L, s.sec, s.m);
        if (s.m) raf ||= requestAnimationFrame(frame);
      }
    }
    // Scroll a row into view where it is going, not where its slide starts.
    function reveal(el, opts) {
      if (!el) return;
      const t = el.style.transform;
      el.style.transform = '';
      el.scrollIntoView(opts);
      el.style.transform = t;
    }

    // The legend draws its samples with the same helpers as the graph (wtMark, bead, pill, diff), so the two always match.
    function renderLegend() {
      const el = $('legend');
      el.hidden = !ui.legend;
      $('legend-btn').setAttribute('aria-pressed', ui.legend);
      if (!ui.legend) return;
      const c = HARNESS.claude.color, byBranch = ui.mode === 'branch', still = () => '0s';
      const svg = (body, box = '0 0 24 24') => `<svg viewBox="${box}" aria-hidden="true">${body}</svg>`;
      const item = (sample, label) => `<div class="lg-item"><span class="lg-s">${sample}</span><span>${label}</span></div>`;
      const agent = status => svg(bead({ kind: 'agent', agent: { harness: 'claude', status }, lead: false }, 12, 12, still), '-3 -3 30 30');
      const dots = byBranch ? [PALETTE[2], PALETTE[3], PALETTE[4]] : [c, HARNESS.codex.color, HUMAN_DOT];
      const colors = byBranch ? '<span>每个分支一种颜色</span>'
        : [[c, 'Claude Code'], [HARNESS.codex.color, 'Codex'], [HARNESS.pi.color, 'Pi'], [TRUNK, 'main'], [QUIET, '闲置分支']]
          .map(([col, name]) => `<span><i style="background:${col}"></i>${name}</span>`).join('');
      setHTML(el, `<div class="lg-head">图例<button class="x" data-close title="关闭图例" aria-label="关闭图例">${CLOSE}</button></div>
        <div class="lg-cols">
          <div>
            <div class="lg-sec">上方 · worktree 和 agent</div>
            ${item(svg(`<path d="M12 11V15" stroke="${c}" stroke-width="2"/>${wtMark(12, 5.5, c)}<circle cx="12" cy="19" r="4" fill="${NOW}" stroke="${c}" stroke-width="1.6"/>`), 'worktree 和里面的 agent')}
            ${item(svg(`<path d="M12 1V14" stroke="${c}" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="12" cy="19" r="4.3" fill="${c}" stroke="${PAGE}" stroke-width="2"/>`), '虚线：worktree 停在的提交')}
            ${item(svg(`<circle cx="5" cy="5" r="3.5" fill="${NOW}" stroke="${c}" stroke-width="1.5"/><path d="M9 5C19 5 19 5 19 15" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/><circle cx="19" cy="19" r="3" fill="${c}"/>`), '点线：子 agent 开的 worktree')}
            ${item(svg(wtMark(12, 12, RETIRED)), '已合并，目录还没移除')}
            ${item('<span class="behind">↓1</span>', '分出来后 main 新增的提交')}
            ${item(diff({ add: 3, del: 1 }), '还没提交的改动')}
          </div>
          <div>
            <div class="lg-sec">agent 状态</div>
            <div class="lg-grid">
              ${item(agent('running'), '运行中')}${item(agent('waiting'), '等你')}
              ${item(agent('done'), '完成')}${item(svg(bead({ kind: 'sub', agent: { harness: 'claude' }, sub: { status: 'running' } }, 12, 12, still)), '子 agent')}
            </div>
            <div class="lg-sec">下方 · 提交历史</div>
            ${item(svg(dots.map((col, i) => `<circle cx="${4.5 + i * 7.5}" cy="12" r="3.2" fill="${col}"/>`).join('')), byBranch ? '提交，颜色是分支' : '提交，颜色是作者')}
            ${item(svg(`<circle cx="12" cy="12" r="3.8" fill="${PAGE}" stroke="${TRUNK}" stroke-width="2"/>`), '合并提交')}
            ${item(pill('main', TRUNK, 'orbit'), '分支检出在 worktree 里')}
            ${item(pill('spike/sqlc', QUIET), '分支没有 worktree')}
          </div>
        </div>
        <div class="lg-colors">泳道颜色：${colors}</div>
        <div class="lg-tip">右键 worktree、agent 或提交：开新任务，以及提交、推送、合并、变基、删除</div>`);
    }

    function renderBar() {
      setHTML($('projects'), REPO + [{ id: 'all', name: '全部' }, ...state.projects].map(p => {
        const waiting = p.worktrees ? agentCount([p], 'waiting') : 0, running = p.worktrees ? agentCount([p], 'running') : 0;
        const badge = waiting ? `<span class="n" title="${waiting} 个 agent 在等你">${waiting}</span>` : running ? '<span class="dot" title="有 agent 在运行"></span>' : '';
        return `<button data-p="${p.id}" aria-pressed="${ui.project === p.id}">${esc(p.name)}${badge}</button>`;
      }).join(''));
      const ps = scope();
      setHTML($('sum'), [['waiting', WAITING], ['running', '#d5d8dd'], ['done', DONE]]
        .map(([s, c]) => { const n = agentCount(ps, s); return n ? `<button data-status="${s}" title="打开下一个「${STATUS[s][0]}」的 agent"><i style="background:${c}"></i>${n} ${STATUS[s][0]}</button>` : ''; })
        .join(''));
    }

    function focusSet(p, b) {
      const set = new Set([b]);
      const wt = p.worktrees.find(w => w.branch === b);
      if (wt) for (const a of wt.agents) for (const s of a.subagents || []) if (s.branch) set.add(s.branch);
      return set;
    }
    function applyFocus() {
      const f = ui.pinned;
      root.querySelectorAll('.project').forEach(sec => {
        const p = projectOf(sec.dataset.p), set = f && p && f.p === p.id ? focusSet(p, f.b) : null;
        const g = sec.querySelector('.graph');
        g.classList.toggle('focusing', !!set);
        g.querySelectorAll('[data-b]').forEach(el => el.classList.toggle('on', !!set && set.has(el.dataset.b)));
      });
    }

    function commit(p, branch, author, sub) {
      const parent = headOf(p, branch), n = (p.msgN[branch] = (p.msgN[branch] || 0) + 1);
      const msgs = p.msgs[branch] || MSGS[branch] || MSGS[sub] || ['chore: checkpoint'];
      const c = { id: 'n' + (++state.seq), branch, parents: parent ? [parent] : [], msg: msgs[(n - 1) % msgs.length], author, sub, ts: Date.now(), fresh: true };
      p.commits.push(c);
      const wt = p.worktrees.find(w => w.branch === branch);
      // What was uncommitted goes into the branch. A subagent's own branch has no worktree here, so it brings a bit of its own.
      const who = wt ? wt.agents.find(a => a.harness === author && !a.role) || wt.agents.find(a => !a.role && a.harness !== 'human')
        : allSubs(p).find(s => s.branch === branch);
      fold(p, branch, wt ? wt.add : rnd(6, 40), wt ? wt.del : rnd(0, 8), who);
      if (wt) { wt.add = rnd(0, 6); wt.del = rnd(0, 2); }
      return c;
    }
    // Lines committed on a branch land on the file its agent was last editing (or the branch's first file; on a new
    // branch, the first file the agent's task script edits).
    function fold(p, branch, add, del, who) {
      if (branch === 'main' || !(add + del)) return;
      const files = p.changes[branch] ||= new Map();
      const writes = x => x.name === 'Edit' || x.name === 'Write';
      const e = who?.log?.findLast(x => x.t === 'tool' && writes(x)) || (who?.script || []).map(tool).find(writes);
      const path = e?.arg || [...files.keys()][0];
      if (!path) return;
      const f = files.get(path) || { path, st: e?.name === 'Write' ? 'A' : 'M', add: 0, del: 0 };
      f.add += add;
      if (f.st !== 'A') f.del += del; // a new file has nothing to remove
      files.set(path, f);
    }
    // A subagent's branch merged back into its parent's: its files become part of the parent branch.
    function absorb(p, from, to) {
      for (const f of p.changes[from]?.values() || []) {
        const files = p.changes[to] ||= new Map(), g = files.get(f.path);
        if (g) { g.add += f.add; g.del += f.del; } else files.set(f.path, { ...f });
      }
    }
    function spawn(p, a, wt) {
      const used = new Set(a.subagents.map(s => s.name));
      const free = TEMPLATES.filter(t => !used.has(t.name));
      if (!free.length) return;
      const t = free[Math.floor(Math.random() * free.length)];
      const [task, prompt] = SUB_TASK[t.name];
      const s = { id: 's' + (++state.seq), name: t.name, task, status: 'running', activity: SUB_SCRIPT[t.name][0], fresh: true };
      s.log = [{ t: 'user', text: prompt }, tool(s.activity)];
      if (t.own) {
        const stem = wt.branch.split('/').pop();
        let b = `${stem}/${t.name}`, n = 2;
        while (p.commits.some(c => c.branch === b) || allSubs(p).some(x => x.branch === b)) b = `${stem}/${t.name}-${n++}`;
        Object.assign(s, { branch: b, path: `.claude/worktrees/${b.split('/').pop()}`, base: tipOf(p, wt.branch) });
      }
      a.subagents.push(s);
      say(a, { t: 'spawn', s });
    }
    function finish(p, s, a, wt) {
      s.status = 'done';
      say(s, { t: 'text', text: SUB_DONE[s.name] || '完成。' });
      if (s.branch && tipOf(p, s.branch)) {
        const m = { id: 'n' + (++state.seq), branch: wt.branch, parents: [tipOf(p, wt.branch), tipOf(p, s.branch)], msg: `Merge ${s.branch}`, author: a.harness, ts: Date.now(), fresh: true };
        p.commits.push(m);
        p.merged.add(s.branch);
        absorb(p, s.branch, wt.branch);
        s.activity = `已合并回 ${wt.branch}`;
        say(a, { t: 'commit', c: m });
      } else {
        s.activity = '已返回结果';
      }
    }
    // Move an agent on to its next scripted tool call; the transcript records each call as it starts.
    function step(x, list, talk) {
      const next = pick(list || [x.activity], x.activity);
      if (next === x.activity) return;
      if (talk && Math.random() < .12) say(x, { t: 'text', text: pick(SAYS) });
      x.activity = next;
      say(x, tool(next));
    }

    function tick() {
      for (const p of state.projects) for (const wt of [...p.worktrees]) for (const a of wt.agents) {
        if (a.harness === 'human') continue;
        if (a.status === 'running' || a.status === 'waiting') a.elapsed += TICK / 1000;
        if (a.status === 'running') {
          if (Math.random() < .5) step(a, SCRIPT[a.id] || a.script, true);
          if (!a.role) {
            wt.add += rnd(0, 7);
            wt.del += rnd(0, 3);
            if (Math.random() < .035) say(a, { t: 'commit', c: commit(p, wt.branch, a.harness) });
          }
          if (a.work && --a.work === 0) {
            // A task you started, or a follow-up you sent, has been handled: the agent commits what it changed, and
            // review comments it was handed count as dealt with.
            if (wt.add + wt.del) { say(a, { t: 'commit', c: commit(p, wt.branch, a.harness) }); wt.add = wt.del = 0; }
            a.status = 'done';
            if (a.fixing) {
              wt.resolved = new Set([...(wt.resolved || []), ...a.fixing]);
              a.activity = `已处理 ${a.fixing.length} 条评论`;
              say(a, { t: 'text', text: `${a.fixing.length} 条评论都改好了，测试通过，已提交。` });
              a.fixing = null;
            } else if (a.brief) {
              const n = filesOf(p, wt.branch).length;
              a.brief = false;
              a.activity = `${n} 个文件 · 测试通过`;
              say(a, { t: 'text', text: `完成了：改了 ${n} 个文件，测试都通过。可以在「改动」里看看，没问题就合并。` });
            } else {
              a.activity = '按你说的改好了';
              say(a, { t: 'text', text: '改好了，相关测试都通过。还有要调整的吗？' });
            }
          } else if (a.role === 'review' && Math.random() < .03) {
            a.status = 'done';
            a.activity = '留下 4 条评论';
            say(a, { t: 'text', text: 'Review 完成，留下 4 条评论：进度存储缺版本号、邀请用户的跳转少一个测试，另有两处命名。' });
          } else if (a.ask && Math.random() < .012) {
            a.status = 'waiting';
            [a.activity, a.pending] = a.ask;
            say(a, { t: 'ask', text: a.ask[0], cmd: a.ask[1], res: null });
          } else if (a.spawns && a.subagents.length < 3 && Math.random() < .05) spawn(p, a, wt);
        }
        for (const s of [...(a.subagents || [])]) {
          if (s.status === 'running') {
            if (Math.random() < .5) step(s, SUB_SCRIPT[s.name]);
            if (s.branch && Math.random() < .07) say(s, { t: 'commit', c: commit(p, s.branch, a.harness, s.name) });
            if (Math.random() < .035) finish(p, s, a, wt);
          } else if (Math.random() < .06) {
            a.subagents.splice(a.subagents.indexOf(s), 1);
          }
        }
      }
      // While you press or aim at something in the graph it holds still; the panel and the counts keep going.
      if (pressing) stale = true;
      else if (aiming()) { stale = true; renderBar(); renderChat(); }
      else render();
    }

    function act(p, kind, id) {
      if (kind === 'merge' || kind === 'prune' || kind === 'commit') {
        // 合并, 移除 worktree and 提交 (on rows and in the 改动 tab) follow the same rules as the right-click menu.
        const wt = p.worktrees.find(w => w.id === id);
        if (wt) gitAct(p, { merge: 'merge', prune: 'delete', commit: 'commit' }[kind], wt.branch);
        return;
      } else if (kind === 'review') {
        // 查看改动 on a finished agent: its panel, open on the 改动 tab.
        const a = p.worktrees.flatMap(w => w.agents).find(x => x.id === id);
        if (a) openChat(p, a, null, false, 'changes');
        return;
      } else {
        const a = p.worktrees.flatMap(w => w.agents).find(x => x.id === id);
        const ask = a.log.findLast(e => e.t === 'ask' && !e.res);
        if (ask) ask.res = kind;
        a.status = 'running';
        a.activity = kind === 'allow' ? a.pending : '已拒绝 · 改用只读检查';
        say(a, kind === 'allow' ? tool(a.pending) : { t: 'text', text: '好，不运行这个命令，先用只读的方式检查。' });
      }
      render();
    }

    // The 合并 / 移除 worktree buttons on rows run the same actions as the menu, under the same rules.
    function gitAct(p, kind, b) {
      const s = gitState(p, b);
      if (!s[kind]) gitDo(p, kind, b, s);
    }
    function gitDo(p, kind, b, s) {
      const wt = s.wt, cmd = gitCmd(p, kind, b, s);
      const tell = text => wt && wt.agents.forEach(a => a.harness !== 'human' && say(a, { t: 'note', text }));
      if (kind === 'commit') {
        commit(p, b, 'human');
        wt.add = wt.del = 0;
        tell('你提交了工作区的改动');
        toast('已提交', cmd);
      } else if (kind === 'push') {
        p.remote[b] = s.tip;
        toast('已推送', cmd);
      } else if (kind === 'merge') {
        const pr = p.prs[b];
        p.commits.push({ id: 'n' + (++state.seq), branch: 'main', parents: [tipOf(p, 'main'), s.tip], msg: `Merge ${pr ? `#${pr} ` : ''}${b}`, author: 'human', ts: Date.now(), fresh: true });
        p.merged.add(b);
        if (wt) {
          // Merging finishes the agents, but the worktree stays on disk until you remove it.
          tell('已合并到 main，会话结束');
          Object.assign(wt, { merged: true, agents: [], add: 0, del: 0 });
        }
        toast('已合并到 main', cmd);
      } else if (kind === 'rebase') {
        const n = rebase(p, b);
        tell('你把分支变基到了最新的 main');
        toast(`已变基 ${n} 个提交`, cmd);
      } else if (kind === 'delete') {
        if (wt) {
          tell('worktree 已移除，会话结束');
          p.worktrees = p.worktrees.filter(w => w !== wt);
          toast(wt.merged ? '已移除 worktree' : '已移除 worktree，分支保留', cmd);
        } else {
          p.commits = p.commits.filter(c => c.branch !== b);
          delete p.remote[b];
          delete p.changes[b];
          toast('已删除分支', cmd);
        }
        if (ui.pinned?.b === b) ui.pinned = null;
      }
      render();
    }

    // Right-click menu. It is drawn once when it opens, like a native menu; a click re-checks the action before running it.
    function openMenu(p, key, x, y) {
      const b = menuBranch(p, key), c = !b && key.startsWith('c:') ? key.slice(2) : null;
      if (!b && !c) return false;
      ui.menu = { p: p.id, b, c, key, x, y, confirm: false, back: document.activeElement };
      drawMenu();
      outline();
      $('menu').focus({ preventScroll: true });
      return true;
    }
    // Opening and closing only move the outline, without re-rendering rows, so a right-click that closes one menu
    // still lands on the row it was aimed at. Re-renders pick the outline up from ui.menu.
    function outline() {
      const m = ui.menu;
      root.querySelectorAll('.row.ctx').forEach(r => r.classList.remove('ctx'));
      if (m) root.querySelectorAll(`.project[data-p="${m.p}"] .row`).forEach(r => r.dataset.key === m.key && r.classList.add('ctx'));
    }
    function drawMenu() {
      const m = ui.menu, el = $('menu');
      el.innerHTML = menuHTML(projectOf(m.p), m);
      el.hidden = false;
      // At the pointer, flipped left or up when it would run off the screen, and always kept inside it.
      const w = el.offsetWidth, h = el.offsetHeight;
      const x = m.x + w > innerWidth - 8 ? m.x - w : m.x, y = m.y + h > innerHeight - 8 ? m.y - h : m.y;
      el.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
      el.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
    }
    function closeMenu() {
      const m = ui.menu, el = $('menu');
      if (!m) return;
      const focused = el.contains(document.activeElement);
      ui.menu = null;
      el.hidden = true;
      if (focused) m.back?.focus?.({ preventScroll: true });
      outline();
    }
    // Replay the branch's own commits on top of main. Subagent branches merged into it stay merges.
    function rebase(p, b) {
      const copies = new Map();
      let parent = tipOf(p, 'main');
      for (const c of p.commits.filter(x => x.branch === b)) {
        const n = { ...c, id: 'n' + (++state.seq), parents: [parent, ...c.parents.slice(1)], ts: Date.now(), fresh: true };
        copies.set(c.id, n);
        parent = n.id;
      }
      p.commits = p.commits.filter(c => c.branch !== b).concat([...copies.values()]);
      // Transcripts that mention the old commits now point at the rewritten ones.
      for (const wt of p.worktrees) for (const a of wt.agents) for (const x of [a, ...(a.subagents || [])]) {
        for (const e of x.log || []) if (e.t === 'commit' && copies.has(e.c.id)) e.c = copies.get(e.c.id);
      }
      return copies.size;
    }
    let toastTimer = null;
    function toast(what, cmd) {
      const el = $('toast');
      el.innerHTML = `<b>${esc(what)}</b>${cmd ? `<code>${esc(cmd)}</code>` : ''}`;
      el.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('on'), 2800);
    }

    function setLive() {
      clearInterval(timer);
      timer = ui.live ? setInterval(tick, TICK) : null;
    }
    function go(id) {
      if (ui.project === id) return;
      ui.project = id;
      ui.pinned = null;
      render();
      root.scrollLeft = 0;
      window.scrollTo(0, 0);
    }

    // The conversation panel: transcript and prompt for the agent (or subagent) picked in the graph.
    // tab: 'chat', the conversation, or 'changes', what the worktree's branch changes against main (and the merge).
    function openChat(p, a, s = null, toggle = false, tab = 'chat') {
      const c = ui.chat;
      if (toggle && c && c.a === a && c.s === s) { closeChat(); return; }
      ui.draft = null; // a task you were writing keeps its text for next time (taskText)
      if (!c || c.a !== a) $('prompt').value = drafts.get(a) || '';
      const wt = p.worktrees.find(w => w.agents.includes(a)), same = c && c.wt === wt;
      // Files you opened stay open while you move between the agents of one worktree.
      ui.chat = { p, a, s, wt, stick: true, tab, open: same ? c.open : new Set(), seen: same && c.seen };
      if (tab === 'changes') showChanges(ui.chat);
      ui.pinned = null;
      render();
      fit();
      // The panel narrows the graph; keep the picked row in view.
      reveal(root.querySelector('.row.sel'), { block: 'nearest', inline: 'nearest' });
      if (!s) $('prompt').focus({ preventScroll: true });
    }
    function closeChat() {
      ui.chat = null;
      render();
    }
    function fit() {
      const ta = $('prompt');
      if ($('composer').hidden) return;
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 168) + 'px';
    }

    function renderChat() {
      const c = ui.chat, d = ui.draft;
      document.body.classList.toggle('chatting', !!(c || d));
      $('panel').hidden = !(c || d);
      $('panel').setAttribute('aria-label', d ? '新任务' : 'Agent 对话');
      $('draft').hidden = !d;
      if (d) { renderDraft(d); return; }
      if (!c) return;
      const { p, a, s } = c, x = s || a, h = HARNESS[a.harness];
      c.wt = p.worktrees.find(w => w.agents.includes(a)) || c.wt;
      // Merging a worktree ends its agents' sessions; the transcript stays readable.
      const wt = c.wt, ended = !p.worktrees.includes(wt) || !wt.agents.includes(a);
      const tab = s ? 'chat' : c.tab; // subagents only have their conversation
      const rv = reviewOf(wt), flagged = rv?.comments.some(n => !n.done);
      const tabs = s ? '' : '<div class="tabs" role="tablist" aria-label="面板内容">'
        + `<button class="tab" role="tab" data-tab="chat" aria-selected="${tab === 'chat'}">对话</button>`
        + `<button class="tab" role="tab" data-tab="changes" aria-selected="${tab === 'changes'}">改动<span class="n">${filesOf(p, wt.branch).length}</span>`
        + `${flagged ? '<span class="flag" title="有没处理的 review 评论"></span>' : ''}</button></div>`;
      const lane = b => ui.mode === 'branch' ? branchColor(p, b) : wt.merged ? RETIRED : h.color;
      const running = x.status === 'running';
      const time = !s && !ended && (running || x.status === 'waiting') ? ` <em>${dur(a.elapsed)}</em>` : '';
      const state = ended ? `<span class="state${wt.merged ? ' done' : ''}">${wt.merged ? '已合并' : '已结束'}</span>`
        : `<span class="state ${x.status}"${running ? ` style="color:${h.color}"` : ''}>${STATUS[x.status][0]}${time}</span>`;
      const close = `<button class="x" data-close title="关闭（Esc）" aria-label="关闭">${CLOSE}</button>`;
      const where = (path, b) => `<span class="wt-name">${FOLDER}<span>${esc(path)}</span></span>${pill(b, lane(b))}`;
      setHTML($('chat-head'), s
        ? `<div class="ph1"><button class="back" data-parent title="回到 ${h.name} 的对话">‹ ${h.name}</button><span class="crumb">/</span>
             <span class="who" style="color:${s.status === 'done' ? 'var(--secondary)' : h.color}">${esc(s.name)}</span>${state}${close}</div>
           <div class="ph-task">${esc(s.task || s.name)}</div>
           <div class="ph-ctx"><span>${esc(p.name)} · 子 agent</span>${s.branch ? where(s.path, s.branch) : where(wt.path, wt.branch)}</div>`
        : `<div class="ph1">${avatar(a.harness)}<span class="who" style="color:${h.color}">${h.name}</span>${a.role ? `<span class="role">${a.role}</span>` : ''}${state}${close}</div>
           <div class="ph-task">${esc(a.task)}</div>
           <div class="ph-ctx"><span>${esc(p.name)}</span>${where(wt.path, wt.branch)}${p.prs[wt.branch] ? `<span class="pr">#${p.prs[wt.branch]}</span>` : ''}</div>${tabs}`);

      $('chat-list').hidden = tab !== 'chat';
      $('review').hidden = tab !== 'changes';
      $('decide').hidden = tab !== 'changes' || !p.worktrees.includes(wt);
      if (tab === 'changes') {
        patch($('review'), reviewItems(c));
        setHTML($('decide'), decideHTML(c));
      } else {
        // Messages. The newest tool call spins while the agent runs; otherwise a "thinking" line stands in for it.
        const log = x.log || [], live = !ended && running, last = log.length - 1;
        const items = log.map((e, i) => entryHTML(e, i, c, live && i === last, ended));
        if (live && log[last]?.t !== 'tool') items.push(`<div class="m tool live" style="--c:${h.color}"><span class="tn">思考中…</span></div>`);
        const list = $('chat-list');
        const atEnd = c.stick || list.scrollHeight - list.scrollTop - list.clientHeight < 60;
        patch(list, items);
        if (atEnd) list.scrollTop = list.scrollHeight; // follow new messages unless you scrolled up to read
        c.stick = false;
      }

      // Prompt box. Subagents take instructions from their parent only; ended sessions take none.
      const note = s ? `子 agent 只接收 ${h.name} 的指令。<button class="link" data-parent>回到 ${h.name}</button>`
        : ended ? `${wt.merged ? 'worktree 已合并到 main，' : ''}这个会话已结束。` : '';
      $('composer').hidden = !!note;
      $('ended').hidden = !note;
      setHTML($('ended'), note);
      if (!note) {
        $('prompt').placeholder = tab === 'changes' ? `哪里要改？告诉 ${h.name}…`
          : x.status === 'waiting' ? '不允许的话，告诉它该怎么做…'
          : x.status === 'done' ? `继续追问 ${h.name}…` : `补充说明，${h.name} 会在下一步读到…`;
        $('hint').textContent = 'Enter 发送 · Shift+Enter 换行';
        $('send').setAttribute('aria-label', '发送');
        $('send').disabled = !$('prompt').value.trim();
      }
    }

    function entryHTML(e, i, c, live, ended) {
      const { p, a, s } = c, h = HARNESS[a.harness];
      if (e.t === 'user') return s
        ? `<div class="m user from"><div class="from-l">${h.name} 派来的任务</div><div class="bubble">${esc(e.text)}</div></div>`
        : `<div class="m user"><div class="bubble">${esc(e.text)}</div></div>`;
      if (e.t === 'text') return `<div class="m text">${esc(e.text)}</div>`;
      if (e.t === 'tool') {
        return `<div class="m tool${live ? ' live' : ''}" style="--c:${h.color}" title="${esc(`${e.name} ${e.arg}`)}"><span class="tn">${esc(e.name)}</span>`
          + `<span class="ta">${esc(e.arg)}</span>${e.out ? `<span class="to">→ ${esc(e.out)}</span>` : ''}</div>`;
      }
      if (e.t === 'commit') {
        const col = ui.mode === 'branch' ? branchColor(p, e.c.branch) : e.c.author === 'human' ? HUMAN_DOT : HARNESS[e.c.author].color;
        return `<button class="m commit" data-i="${i}" title="在图中定位这个提交"><i style="background:${col}"></i><span class="lbl">提交</span>`
          + `<span class="cmsg">${esc(e.c.msg)}</span><span class="csha">${sha(e.c.id)}</span></button>`;
      }
      if (e.t === 'spawn') {
        const done = e.s.status === 'done';
        return `<button class="m spawn" data-i="${i}" title="查看 ${esc(e.s.name)} 的对话"><span class="lbl">子 agent</span>`
          + `<span class="who" style="color:${done ? 'var(--secondary)' : h.color}">${esc(e.s.name)}</span>${done ? '<span class="state done">完成</span>' : ''}`
          + `<span class="sact">${esc(e.s.activity)}</span><span class="chev">›</span></button>`;
      }
      if (e.t === 'ask') {
        const open = !e.res && !ended && a.status === 'waiting';
        return `<div class="m ask${open ? '' : ' resolved'}"><div class="ask-t">${esc(e.text)}</div><code>${esc(e.cmd)}</code>`
          + (open
            ? `<div class="ask-b"><button class="btn allow" data-act="allow" data-id="${a.id}">允许</button><button class="btn" data-act="deny" data-id="${a.id}">拒绝</button><span class="res">或直接回复，告诉它怎么做</span></div>`
            : `<div class="res">${e.res === 'deny' ? '已拒绝' : e.res === 'allow' ? '已允许' : '未处理'}</div>`)
          + '</div>';
      }
      return `<div class="m note">${esc(e.text)}</div>`;
    }

    // ---- The 改动 tab: what the worktree's branch changes against main, the review on it, and the merge under it.
    const base = path => path.slice(path.lastIndexOf('/') + 1);
    const filesOf = (p, b) => [...(p.changes[b]?.values() || [])].sort((x, y) => x.path.localeCompare(y.path));
    const ST = { A: '新文件', M: '修改', D: '删除' };
    const stat = (add, del) => `<span class="diff"><span class="add">+${add}</span><span class="del">−${del}</span></span>`;
    // Five blocks, green for added lines and red for removed, the way GitHub sums up a file.
    const bar = (add, del) => {
      const t = add + del, g = t ? Math.round(add / t * 5) : 0;
      return `<span class="dstat" aria-hidden="true">${[0, 1, 2, 3, 4].map(i => `<i class="${i < g ? 'a' : t ? 'd' : ''}"></i>`).join('')}</span>`;
    };
    // The review on a worktree: its reviewer agent and the comments left so far. A comment the author has fixed is done.
    function reviewOf(wt) {
      const r = wt.agents.find(a => a.role === 'review');
      if (!r) return null;
      const said = new Set((r.log || []).filter(e => e.t === 'tool' && e.name === 'Comment').map(e => e.arg));
      const comments = (REVIEW[r.id] || []).map(([file, line, text]) => ({ file, line, text, key: `${base(file)}:${line}`, who: r.harness }))
        .filter(n => r.status === 'done' || said.has(n.key)).map(n => ({ ...n, done: !!wt.resolved?.has(n.key) }));
      return { agent: r, comments };
    }
    const noteHTML = n => `<div class="dcm${n.done ? ' done' : ''}" data-key="${esc(n.key)}">${avatar(n.who)}<div class="dcm-t">`
      + `<b>${HARNESS[n.who].name}</b>${n.done ? '<span class="rv-ok">已处理</span>' : ''}<div>${esc(n.text)}</div></div></div>`;
    // One hunk of a file, numbered the way git shows it; a review comment sits under the line it is about.
    function diffHTML(f, notes) {
      const d = DIFFS[f.path], shown = new Set();
      if (!d) return `<div class="dv"><div class="dv-in"><div class="dx">原型里没有模拟这个文件的 diff。</div>${notes.map(noteHTML).join('')}</div></div>`;
      const [[o0, n0], ...lines] = d;
      let o = o0, n = n0, body = '';
      for (const l of lines) {
        const k = l[0], cls = k === '+' ? ' a' : k === '-' ? ' d' : '';
        body += `<div class="dl${cls}"><span class="ln">${k === '-' ? o : n}</span><span class="sg">${k === '+' ? '+' : k === '-' ? '−' : ''}</span><span class="dt">${esc(l.slice(1))}</span></div>`;
        if (k !== '+') o++;
        if (k === '-') continue;
        for (const x of notes) if (x.line === n) { body += noteHTML(x); shown.add(x); }
        n++;
      }
      const olds = lines.filter(l => l[0] !== '+').length, news = lines.filter(l => l[0] !== '-').length;
      return `<div class="dv"><div class="dv-in"><div class="dh">@@ -${o0},${olds} +${n0},${news} @@</div>${body}`
        + `${notes.filter(x => !shown.has(x)).map(noteHTML).join('')}</div></div>`;
    }
    function fileHTML(f, open, notes) {
      const name = base(f.path), todo = notes.some(n => !n.done);
      return `<div class="rv-f${open ? ' open' : ''}"><button class="rv-fh" data-file="${esc(f.path)}" aria-expanded="${open}" title="${esc(f.path)}">`
        + `<span class="st st-${f.st}" title="${ST[f.st]}">${f.st}</span>`
        + `<span class="fp"><span class="fd">${esc(f.path.slice(0, -name.length))}</span><span class="fn">${esc(name)}</span></span>`
        + (notes.length ? `<span class="fc${todo ? '' : ' done'}" title="${notes.length} 条 review 评论">${notes.length}</span>` : '')
        + `${stat(f.add, f.del)}${bar(f.add, f.del)}<span class="chev">›</span></button>${open ? diffHTML(f, notes) : ''}</div>`;
    }
    function commitRow(p, x) {

    // The tab's content as five fixed slots, so patch() only redraws the ones that changed (open diffs stay put).

      const add = files.reduce((n, f) => n + f.add, 0), del = files.reduce((n, f) => n + f.del, 0);
      const rv = reviewOf(wt), notes = rv ? rv.comments : [], author = wt.agents.find(x => !x.role && x.harness !== 'human');
      const where = wt.merged ? '已合并到 main' : b === 'main' ? '' : s.behind ? `落后 main ${s.behind} 个提交` : '基于最新的 main';
      const sum = `<div class="rv-sum"><span>${files.length} 个文件</span>${stat(add, del)}<span>· ${own.length} 个提交</span><span class="base">${where}</span></div>`;
      let review = '<div hidden></div>';
      if (rv) {

          + `<span class="rv-k"><span class="rv-at">${esc(n.key)}</span>${n.done ? '<span class="rv-ok">已处理</span>' : ''}</span>`

          + `<span class="state ${r.status}"${r.status === 'running' ? ` style="color:${rh.color}"` : ''}>${r.status === 'done' ? '完成' : '进行中'}</span>`
          + `<span class="rv-n">${notes.length ? `${notes.length} 条评论` : '还没有评论'}</span></div>${list}${foot ? `<div class="rv-bf">${foot}</div>` : ''}</div>`;
      }
      let dirty = '<div hidden></div>';
      if (!wt.merged && wt.add + wt.del) {
        // Which files the agent touched since its last commit.
        const log = author?.log || [], since = log.slice(log.findLastIndex(e => e.t === 'commit') + 1);
        const touched = [...new Set(since.filter(e => e.t === 'tool' && (e.name === 'Edit' || e.name === 'Write')).map(e => base(e.arg)))].slice(-2);
        dirty = `<div class="rv-box rv-dirty"><span>还没提交</span>${stat(wt.add, wt.del)}`
          + (touched.length ? `<span class="rv-at">${author.status === 'running' ? '正在改' : '改了'} ${esc(touched.join('、'))}</span>` : '')

      }
      const list = files.length ? `<div class="rv-list">${files.map(f => fileHTML(f, c.open.has(f.path), notes.filter(n => n.file === f.path))).join('')}</div>`

    }
    // Under the tab: whether the branch can go into main, and the button that does it.
    function decideHTML(c) {

      const rv = reviewOf(wt), todo = rv ? rv.comments.filter(n => !n.done).length : 0;
      const warn = s.merge ? '' : todo ? `还有 ${todo} 条 review 评论没处理`
        : rv && rv.agent.status !== 'done' ? `${HARNESS[rv.agent.harness].name} 的 review 还没结束` : s.behind ? `落后 main ${s.behind} 个提交` : '';
      return `<div class="dz-l"><span class="dz${s.merge ? '' : ' ok'}">${esc(s.merge || '可以合并')}</span>${warn ? `<span class="dz-w">${esc(warn)}</span>` : ''}</div>`
        + `<button class="btn merge" data-act="merge" data-id="${wt.id}"${s.merge ? ' aria-disabled="true"' : ''} title="${esc(s.merge || gitCmd(p, 'merge', b, s))}">合并到 main</button>`;
    }
    // The first time the tab opens for a worktree, files with open review comments are expanded.

      if (c.seen) return;

      for (const n of reviewOf(c.wt)?.comments || []) if (!n.done) c.open.add(n.file);
    }
    // 把评论发给…: the open comments go to the worktree's author as one message, and the panel follows that conversation.
    function sendReview(c) {
      const { p, wt } = c, rv = reviewOf(wt), author = wt.agents.find(x => !x.role && x.harness !== 'human');
      const todo = rv ? rv.comments.filter(n => !n.done) : [];
      if (!author || !todo.length || author.fixing) return;
      deliver(author, `${HARNESS[rv.agent.harness].name} 的 review 有 ${todo.length} 条评论，逐条改完再提交：\n`
        + todo.map((n, i) => `${i + 1}. ${n.key} ${n.text}`).join('\n'));
      author.fixing = todo.map(n => n.key);
      author.work ||= rnd(5, 9);
      openChat(p, author);
    }

    // ---- New tasks. A task is an agent with your prompt, in a worktree. kind 'new' forks a new branch off commit base
    // into a new worktree; 'branch' checks out branch b, which has none, into a new one; 'here' starts in worktree wt,
    // where nobody is working. The panel holds the draft while you write it, and the graph shows its outline (ghostOf()).
    const taskText = new Map(); // what you wrote for a task you haven't started, per project
    // A task's title is its first sentence; rows cut it off further where they are narrow.
    function titleOf(text) {
      const line = text.trim().split('\n')[0].trim(), cut = line.search(/[。！？!?；;]|\.(\s|$)/);
      const t = (cut > 0 ? line.slice(0, cut) : line).trim();
      return t.length > 48 ? t.slice(0, 47) + '…' : t;
    }
    const taken = (p, b) => p.merged.has(b) || p.commits.some(c => c.branch === b) || p.worktrees.some(w => w.branch === b) || allSubs(p).some(s => s.branch === b);
    function nameError(p, b) {
      if (!b) return '写一个分支名';
      if (b === '@' || /[\s~^:?*[\\\x00-\x1f\x7f]|\.\.|@\{|\/\/|^[-/.]|\/\.|[/.]$|\.lock$/.test(b)) return 'git 不接受这个分支名';
      return taken(p, b) ? '这个分支已经存在' : '';
    }
    const STOP = new Set(['a', 'an', 'the', 'to', 'of', 'for', 'and', 'or', 'in', 'on', 'with', 'is', 'be']);
    // claude/add-dark-mode from the prompt's first English words, claude/task-3f2a when it has none (a prompt in Chinese,
    // say). Short, because the worktree folder is named after it and worktree names are never cut off.
    function suggest(p, d) {
      const words = (d.text.match(/[A-Za-z][A-Za-z0-9]*/g) || []).map(w => w.toLowerCase()).filter(w => !STOP.has(w)).slice(0, 3);
      const stem = `${d.h}/${words.join('-').slice(0, 24).replace(/-+$/, '') || `task-${d.tag}`}`;
      let b = stem, n = 2;
      while (taken(p, b)) b = `${stem}-${n++}`;
      return b;
    }
    // A new branch follows the prompt and the harness until you name it yourself. ok: the last name that would work,
    // which the outline and the worktree folder keep while the one you are typing doesn't.
    function rename(p, d) {
      if (d.kind === 'new' && !d.named) d.branch = suggest(p, d);
      if (d.kind !== 'new' || !nameError(p, d.branch)) d.ok = d.branch; // the others carry on with a branch that exists
      if (d.kind !== 'here') d.path = folderFor(p, d.ok);
    }
    // Why the task can't start as it stands ('' when it can). Its commit, branch or worktree may have moved on meanwhile.
    function draftError(p, d) {
      if (d.kind === 'here') {
        const wt = p.worktrees.find(w => w.id === d.wtId);
        return wt ? takeState(p, wt.branch) : 'worktree 已经移除';
      }
      if (d.kind === 'branch') return p.commits.some(c => c.branch === d.branch) ? takeState(p, d.branch) : '分支已经删除';
      return p.commits.some(c => c.id === d.base) ? nameError(p, d.branch) : '这个提交已经不在了';
    }
    // The outline of the task you are writing: its worktree and agent, with the ids the real ones will get, so starting
    // turns them solid in place. In a worktree that exists only the agent is new.
    function ghostOf(p) {
      const d = ui.draft;
      if (!d || d.p !== p.id) return null;
      const agent = { id: d.aId, harness: d.h, status: 'draft', task: titleOf(d.text), activity: '', subagents: [], ghost: true };
      if (d.kind === 'here') {
        const wt = p.worktrees.find(w => w.id === d.wtId);
        return wt ? { wt, agent } : null;
      }
      return { wt: { id: d.wtId, path: d.path, branch: d.ok, base: d.kind === 'new' ? d.base : null, add: 0, del: 0, agents: [agent], ghost: true }, agent };

    function openDraft(p, kind, { base = null, b = null, wt = null } = {}) {

      const d = { p: p.id, kind, base, h: old ? old.h : ui.pickH, aId: old ? old.aId : 't' + n, tag: old ? old.tag : sha('t' + n).slice(0, 4),
        wtId: wt ? wt.id : old && old.kind !== 'here' ? old.wtId : 'wt-t' + n, text: taskText.get(p.id) || '', named: false, branch: wt ? wt.branch : b || '' };

      ui.chat = ui.pinned = null;

    function closeDraft() {
      ui.draft = null;

    }
    function choose(h) {

    }
    // The panel while you write a task: the header it will have as a conversation, then who does it and where it starts;

    function renderDraft(d) {
      const p = projectOf(d.p), h = HARNESS[d.h], err = draftError(p, d), title = titleOf(d.text);
      const wt = d.kind === 'here' ? p.worktrees.find(w => w.id === d.wtId) : null;
      const color = ui.mode === 'branch' ? (d.kind === 'new' ? nextColor(p) : branchColor(p, d.ok)) : h.color;
      setHTML($('chat-head'), `<div class="ph1">${avatar(d.h)}<span class="who" style="color:${h.color}">${h.name}</span><span class="state draft">新任务</span>`
        + `<button class="x" data-close title="关闭（Esc）" aria-label="关闭">${CLOSE}</button></div>`
        + `<div class="ph-task${title ? '' : ' empty'}">${esc(title || '写下要做什么，第一句就是标题')}</div>`
        + `<div class="ph-ctx"><span>${esc(p.name)}</span><span class="wt-name">${FOLDER}<span>${esc(wt ? wt.path : d.path)}</span></span>${pill(d.ok, color)}</div>`);

    // Five slots, as in the 改动 tab: harness, where it starts, the new branch's name, what will run (or why it can't), a tip.

        + ['claude', 'codex', 'pi'].map(k => `<button class="nt-h" aria-pressed="false" data-pick="${k}" style="--c:${HARNESS[k].color}">${avatar(k)}<span>${HARNESS[k].name}</span></button>`).join('')
        + '</div></div>';
      let at = '<div hidden></div>', out;
      const wt = d.kind === 'here' && p.worktrees.find(w => w.id === d.wtId);
      if (d.kind === 'new') {
        const c = p.commits.find(x => x.id === d.base);
        if (c) at = `<div><div class="rv-h">从 ${esc(c.branch)} 上的这个提交分出</div><div class="rv-list">${commitRow(p, c)}</div></div>`;
        out = `<div><div class="rv-h">将要执行</div><code class="nt-cmd">${esc(`git worktree add -b ${d.branch} ../${d.path} ${sha(d.base)}`)}</code></div>`;
      } else if (d.kind === 'branch') {
        const own = p.commits.filter(c => c.branch === d.branch).length, n = behindCount(p, d.branch, new Map(p.commits.map(c => [c.id, c])));

      } else if (wt) {
        at = `<div><div class="rv-h">在这个 worktree 里接着做</div><div class="nt-at"><span class="wt-name">${FOLDER}<span>${esc(wt.path)}</span></span>`
          + `${pill(wt.branch, quiet(wt.branch))}${wt.add + wt.del ? diff(wt) : '<span>无改动</span>'}</div></div>`;
        out = `<div class="nt-tip">不用 git 命令：${h.name} 直接在这个 worktree 里开一个会话${wt.add + wt.del ? '，没提交的改动留着，它在这基础上接着改' : ''}。</div>`;

        ? '<label class="nt-f"><span class="rv-h">新分支</span><input class="nt-in" id="branch" spellcheck="false" autocomplete="off" autocapitalize="off"></label>'
        : '<div hidden></div>';

    }
    // Starts it: the worktree (unless it starts in one that exists), the agent with your prompt; the panel follows the agent.
    function startTask() {

      const h = HARNESS[d.h], title = titleOf(text);

    }

    function send() {
      if (ui.draft) { startTask(); return; }
      const c = ui.chat, ta = $('prompt'), text = ta.value.trim();
      if (!c || c.s || !text || !c.wt.agents.includes(c.a)) return;
      deliver(c.a, text);
      ta.value = '';
      drafts.delete(c.a);
      fit();
      c.tab = 'chat'; // asked from the 改动 tab too: what the agent does about it shows in the conversation
      c.stick = true;
      render();
    }
    // A message for an agent. Replying to a permission request turns it down and says what to do instead;
