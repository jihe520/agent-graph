    function deliver(a, text) {
      const was = a.status;
      const ask = a.log.findLast(e => e.t === 'ask' && !e.res);
      if (ask) ask.res = 'deny';
      say(a, { t: 'user', text });
      if (was === 'running') {
        if (a.work) a.work += rnd(2, 4);
      } else {
        a.status = 'running';
        a.activity = '思考中…';
        if (was === 'done') { a.elapsed = 0; a.work = rnd(5, 9); }
      }
      setTimeout(() => { say(a, { t: 'text', text: ACK[was] || ACK.running }); render(); }, 900);
    }

    // Find a commit from the transcript in the graph: scroll to it and light it up for a moment.
    function locate(p, commit) {
      const row = () => root.querySelector(`.project[data-p="${p.id}"] .row[data-c="${commit.id}"]`);
      if (!row()) go(p.id); // older commits only appear in the project's full history
      ui.spot = { c: commit, until: Date.now() + 2400 };
      render();
      reveal(row(), { block: 'center', inline: 'nearest', behavior: 'smooth' });
      setTimeout(render, 2500);
    }

    $('harness').innerHTML = ['claude', 'codex', 'pi']
      .map(h => `<button class="chip" data-h="${h}" aria-pressed="true"><svg viewBox="0 0 16 16">${glyph(h, 8, 8, 16, HARNESS[h].color)}</svg>${HARNESS[h].name}</button>`)
      .join('');
    $('harness').addEventListener('click', e => {
      const btn = e.target.closest('[data-h]');
      if (!btn) return;
      const h = btn.dataset.h;
      if (ui.harness.has(h)) ui.harness.delete(h); else ui.harness.add(h);
      btn.setAttribute('aria-pressed', ui.harness.has(h));
      render();
    });
    $('mode').addEventListener('click', e => {
      const btn = e.target.closest('[data-mode]');
      if (!btn) return;
      ui.mode = btn.dataset.mode;
      $('mode').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === btn));
      render();
    });
    $('wts').addEventListener('click', e => { ui.wts = !ui.wts; e.currentTarget.setAttribute('aria-pressed', ui.wts); render(); });
    $('subs').addEventListener('click', e => { ui.subs = !ui.subs; e.currentTarget.setAttribute('aria-pressed', ui.subs); render(); });
    $('live').addEventListener('click', e => { ui.live = !ui.live; e.currentTarget.setAttribute('aria-pressed', ui.live); setLive(); });
    $('legend-btn').addEventListener('click', () => { ui.legend = !ui.legend; renderLegend(); });
    $('legend').addEventListener('click', e => { if (e.target.closest('[data-close]')) { ui.legend = false; renderLegend(); } });
    new ResizeObserver(() => document.body.style.setProperty('--legend-h', $('legend').offsetHeight + 'px')).observe($('legend'));
    $('reset').addEventListener('click', () => { closeMenu(); state = seed(); ui.pinned = ui.chat = ui.draft = null; taskText.clear(); render(); });
    // Rows hold still under your hand. While the pointer is over a project's "now" band its worktrees keep their order
    // (render() asks heldProject()), and while it moves over the graph, or a press is down, the live tick holds off
    // redrawing it: a click is a press and a release on the same element, and swapping rows out in between swallows it.
    // Whatever was held back catches up, sliding, once the pointer settles or leaves.
    let pressing = false, pointer = null, moved = 0, held = null, stale = false, settle = null;
    // Resting on a button in the graph (允许, 拒绝, 合并…) counts as aiming too: that is where a click is about to land.
    // Checked afresh each time, so once the click has made the button go away the graph moves on.
    const AIM_MS = 800;
    const onButton = () => !!(pointer && document.elementFromPoint(pointer.x, pointer.y)?.closest('#root button'));
    const aiming = () => performance.now() - moved < AIM_MS || onButton();
    function heldProject() {
      const el = pointer && document.elementFromPoint(pointer.x, pointer.y);
      return el?.closest('.now')?.closest('.project')?.dataset.p || null;
    }
    // Fires a little after AIM_MS, so a pointer that has just come to rest no longer counts as aiming.
    const later = () => { clearTimeout(settle); settle = setTimeout(catchUp, AIM_MS + 20); };
    function catchUp() {
      clearTimeout(settle);
      if (!stale) return;
      if (pressing || aiming()) later();
      else render();
    }
    function track(e, move) {
      pointer = { x: e.clientX, y: e.clientY };
      if (move && root.contains(e.target)) moved = performance.now();
      // Leaving the band that was held lets it re-sort.
      if (held && e.target.closest?.('.now')?.closest('.project')?.dataset.p !== held) stale = true;
      later();
    }
    function untrack() {
      pointer = null;
      moved = 0;
      if (held) stale = true;
      catchUp();
    }
    document.addEventListener('pointermove', e => track(e, true), true);
    for (const [type, down] of [['pointerdown', true], ['pointerup', false], ['pointercancel', false]]) {
      document.addEventListener(type, e => { pressing = down; track(e, false); }, true);
    }
    document.documentElement.addEventListener('pointerleave', untrack); // the pointer left the window
    $('projects').addEventListener('click', e => {
      const btn = e.target.closest('[data-p]');
      if (btn) go(btn.dataset.p);
    });
    // "2 等你" and friends open the next agent in that state, so repeated clicks walk through all of them.
    $('sum').addEventListener('click', e => {
      const btn = e.target.closest('[data-status]');
      if (!btn) return;
      const list = scope().flatMap(p => p.worktrees.flatMap(wt => wt.agents.filter(a => a.status === btn.dataset.status).map(a => [p, a])));
      if (!list.length) return;
      const i = list.findIndex(([, a]) => ui.chat && !ui.chat.s && ui.chat.a === a);
      openChat(...list[(i + 1) % list.length]);
    });
    root.addEventListener('click', e => {
      const link = e.target.closest('[data-go]');
      if (link) { go(link.dataset.go); return; }
      const sec = e.target.closest('.project'), p = sec && projectOf(sec.dataset.p);
      if (!p) return;
      // 新任务 in a project's header starts from the newest commit on main.
      if (e.target.closest('[data-new]')) { openDraft(p, 'new', { base: tipOf(p, 'main') }); return; }
      const btn = e.target.closest('[data-act]');
      if (btn) { act(p, btn.dataset.act, btn.dataset.id); return; }
      const row = e.target.closest('.row');
      if (!row || !row.dataset.b) return;
      // The outline of the task you are writing takes you back to writing it.
      if ('draft' in row.dataset) { $('prompt').focus(); return; }
      // Agent and subagent rows open (or, clicked again, close) their conversation; other rows pin their branch.
      const a = row.dataset.a && p.worktrees.flatMap(w => w.agents).find(x => x.id === row.dataset.a);
      if (a) { openChat(p, a, row.dataset.s ? a.subagents.find(x => x.id === row.dataset.s) || null : null, true); return; }
      const target = { p: p.id, b: row.dataset.b };
      ui.pinned = same(ui.pinned, target) ? null : target;
      applyFocus();
    });
    // Right-click a worktree, agent or branch-tip row for its git actions; anywhere else keeps the browser's menu.
    root.addEventListener('contextmenu', e => {
      const row = e.target.closest('.row'), sec = e.target.closest('.project'), p = sec && projectOf(sec.dataset.p);
      if (row && p && openMenu(p, row.dataset.key, e.clientX, e.clientY)) e.preventDefault();
    });
    $('menu').addEventListener('click', e => {
      const task = e.target.closest('[data-task]'), m = ui.menu;
      if (task && m && task.getAttribute('aria-disabled') !== 'true') {
        // Re-checked like the git actions. The commit to start from is the row's, or the branch's newest.
        const p = projectOf(m.p), base = m.c || headOf(p, m.b);
        if (task.dataset.task === 'take' ? takeState(p, m.b) : !p.commits.some(c => c.id === base)) { drawMenu(); return; }
        if (task.dataset.task === 'new') openDraft(p, 'new', { base });
        else {
          const wt = p.worktrees.find(w => w.branch === m.b);
          openDraft(p, wt ? 'here' : 'branch', { b: m.b, wt });
        }
        return;
      }
      const item = e.target.closest('[data-git]');
      if (!item || !m || item.getAttribute('aria-disabled') === 'true') return;
      const p = projectOf(m.p), kind = item.dataset.git, s = gitState(p, m.b);
      if (s[kind]) { drawMenu(); return; } // things moved on since the menu opened; show why it no longer applies
      if (kind === 'delete' && !s.wt && !m.confirm) {
        // Deleting a branch that has no worktree drops its unmerged commits, so the item asks for a second click.
        m.confirm = true;
        drawMenu();
        $('menu').querySelector('[data-git="delete"]').focus();
        return;
      }
      closeMenu();
      gitDo(p, kind, m.b, s);
    });
    $('menu').addEventListener('keydown', e => {
      const items = [...$('menu').querySelectorAll('.mi:not([aria-disabled="true"])')], i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const step = e.key === 'ArrowDown' ? 1 : -1;
        items[i < 0 ? (step > 0 ? 0 : items.length - 1) : (i + step + items.length) % items.length]?.focus();
      } else if (e.key === 'Tab') {
        e.preventDefault();
        closeMenu();
      }
    });
    // Like a native menu, it closes on any press outside it, on scroll or resize, and when the window loses focus.
    document.addEventListener('pointerdown', e => { if (ui.menu && !e.target.closest('#menu')) closeMenu(); }, true);
    document.addEventListener('scroll', () => closeMenu(), true);
    window.addEventListener('resize', () => closeMenu());
    window.addEventListener('blur', () => { closeMenu(); untrack(); });
    $('panel').addEventListener('click', e => {
      const d = ui.draft;
      if (d) {
        // New task: close it, pick who does it, or find the commit it starts from in the graph.
        const p = projectOf(d.p), pickBtn = e.target.closest('[data-pick]'), cm = e.target.closest('[data-commit]');
        const x = cm && p.commits.find(k => k.id === cm.dataset.commit);
        if (e.target.closest('[data-close]')) closeDraft();
        else if (pickBtn) choose(pickBtn.dataset.pick);
        else if (x) locate(p, x);
        return;
      }
      const c = ui.chat;
      if (!c) return;
      if (e.target.closest('[data-close]')) { closeChat(); return; }
      if (e.target.closest('[data-parent]')) { openChat(c.p, c.a); return; }
      const tab = e.target.closest('[data-tab]');
      if (tab) {
        if (tab.dataset.tab === 'changes') showChanges(c);
        else { c.tab = 'chat'; c.stick = true; }
        renderChat();
        return;
      }
      const btn = e.target.closest('[data-act]');
      if (btn) { act(c.p, btn.dataset.act, btn.dataset.id); return; }
      if (e.target.closest('[data-review="send"]')) { sendReview(c); return; }
      // 改动 tab: a file opens or closes its diff; a review comment opens its file and scrolls to it; a commit is found in the graph.
      const file = e.target.closest('[data-file]');
      if (file) {
        const f = file.dataset.file;
        if (c.open.has(f)) c.open.delete(f); else c.open.add(f);
        renderChat();
        return;
      }
      const note = e.target.closest('[data-goto]');
      if (note) {
        c.open.add(note.dataset.goto);
        renderChat();
        $('review').querySelector(`.dcm[data-key="${CSS.escape(note.dataset.key)}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
      }
      const cm = e.target.closest('[data-commit]'), x = cm && c.p.commits.find(k => k.id === cm.dataset.commit);
      if (x) { locate(c.p, x); return; }
      const item = e.target.closest('[data-i]'), entry = item && (c.s || c.a).log[+item.dataset.i];
      if (entry?.t === 'spawn') openChat(c.p, c.a, entry.s);
      else if (entry?.t === 'commit') locate(c.p, entry.c);
    });
    $('prompt').addEventListener('input', e => {
      const d = ui.draft;
      if (d) {
        // Writing a task: its title, its branch name and its outline in the graph follow along.
        d.text = e.target.value;
        taskText.set(d.p, d.text);
        rename(projectOf(d.p), d);
        fit();
        render();
        return;
      }
      if (ui.chat) drafts.set(ui.chat.a, e.target.value);
      fit();
      $('send').disabled = !e.target.value.trim();
    });
    // Naming the new branch yourself; Enter goes on to the prompt, or starts the task when it is written.
    $('draft').addEventListener('input', e => {
      const d = ui.draft;
      if (!d || e.target.id !== 'branch') return;
      d.branch = e.target.value.trim();
      d.named = true;
      rename(projectOf(d.p), d);
      render();
    });
    $('draft').addEventListener('keydown', e => {
      if (e.target.id !== 'branch' || e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      if ($('prompt').value.trim()) startTask(); else $('prompt').focus();
    });
    $('prompt').addEventListener('keydown', e => {
      // Enter sends and Shift+Enter breaks the line, but never while an IME is still composing (pinyin and the like).
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); }
    });
    $('composer').addEventListener('submit', e => { e.preventDefault(); send(); });
    // Esc backs out one step at a time: the menu, then the new task or the conversation, then the picked branch.
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || e.isComposing) return;
      if (ui.menu) closeMenu(); else if (ui.draft) closeDraft(); else if (ui.chat) closeChat(); else if (ui.pinned) { ui.pinned = null; applyFocus(); }
    });

    render();
    setLive();
  </script>
</body>
</html>
