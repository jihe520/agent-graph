<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Agent Graph · 设计探索</title>
  <!-- The drawing in assets/icon.svg, inlined so this file still opens on its own. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='tile' x1='0' y1='0' x2='0' y2='64' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%231c2026'/%3E%3Cstop offset='1' stop-color='%23101215'/%3E%3C/linearGradient%3E%3ClinearGradient id='history' x1='0' y1='50' x2='0' y2='63' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23a3abb8'/%3E%3Cstop offset='1' stop-color='%23a3abb8' stop-opacity='0'/%3E%3C/linearGradient%3E%3ClinearGradient id='spin' x1='25.4' y1='0' x2='51.78' y2='0' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23e58a63' stop-opacity='0'/%3E%3Cstop offset='.35' stop-color='%23e58a63' stop-opacity='.35'/%3E%3Cstop offset='1' stop-color='%23e58a63'/%3E%3C/linearGradient%3E%3Cmask id='gaps'%3E%3Crect width='64' height='64' fill='%23fff'/%3E%3Cg fill='%23000'%3E%3Ccircle cx='39' cy='24' r='9.7'/%3E%3Ccircle cx='19' cy='50' r='6.5'/%3E%3C/g%3E%3C/mask%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23tile)'/%3E%3Crect x='.5' y='.5' width='63' height='63' rx='13.5' fill='none' stroke='%23fff' stroke-opacity='.09'/%3E%3Cg fill='none' stroke-width='4.6' stroke-linecap='round' mask='url(%23gaps)'%3E%3Cpath d='M19 12V62' stroke='url(%23history)'/%3E%3Cpath d='M39 24V31C39 40.5 19 40.5 19 50' stroke='%23e58a63'/%3E%3C/g%3E%3Cpath d='M27.22 30.8A13.6 13.6 0 1 1 51.78 19.35' fill='none' stroke='url(%23spin)' stroke-width='3.6' stroke-linecap='round'/%3E%3Ccircle cx='19' cy='50' r='4.8' fill='%23a3abb8'/%3E%3Ccircle cx='39' cy='24' r='8' fill='%23e58a63'/%3E%3C/svg%3E">
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      color: #e8e9eb; background: #101215; font-synthesis: none; -webkit-font-smoothing: antialiased;
      --text: #e8e9eb; --secondary: #a4a9b1; --muted: #6d737c;
      --line: rgba(255,255,255,.075); --hover: rgba(255,255,255,.035); --now: #15181c; --page: #101215;
      --waiting: #f0b54a; --done: #86cf98; --del: #e78585;
      --mono: "SF Mono", ui-monospace, Menlo, monospace;
      --gx: 160px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    button:focus-visible { outline: 2px solid #8ea7ef; outline-offset: 2px; }

    .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 18px; background: rgba(16,18,21,.88); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .projects { display: flex; align-items: center; gap: 2px; margin-right: 6px; }
    .projects > svg { width: 16px; height: 16px; margin: 0 6px 0 2px; fill: none; stroke: var(--secondary); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .projects button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; font-size: 13px; color: var(--muted); }
    .projects button:hover { color: var(--secondary); background: var(--hover); }
    .projects button[aria-pressed="true"] { color: var(--text); font-weight: 600; background: rgba(255,255,255,.07); }
    .projects .n { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; font-size: 10.5px; font-weight: 700; line-height: 16px; text-align: center; color: #1d1606; background: var(--waiting); }
    .projects .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--secondary); }
    .sum { display: flex; gap: 2px; }
    .sum button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 7px; font-size: 12px; color: var(--secondary); }
    .sum button:hover { background: var(--hover); color: var(--text); }
    .sum i { width: 7px; height: 7px; border-radius: 50%; }
    .spacer { flex: 1; }
    .harness { display: flex; gap: 2px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; font-size: 12px; color: var(--secondary); }
    .chip:hover { background: var(--hover); }
    .chip[aria-pressed="false"] { opacity: .4; }
    .chip svg { width: 14px; height: 14px; }
    .sep { width: 1px; height: 18px; margin: 0 6px; background: var(--line); }
    .seg { display: inline-flex; padding: 2px; border-radius: 9px; background: rgba(255,255,255,.035); }
    .seg button { height: 24px; padding: 0 10px; border-radius: 7px; font-size: 12px; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: rgba(255,255,255,.085); color: var(--text); }
    .toggle { height: 28px; padding: 0 10px; border-radius: 8px; font-size: 12px; color: var(--muted); }
    .toggle:hover { color: var(--secondary); }
    .toggle[aria-pressed="true"] { color: var(--text); background: rgba(255,255,255,.06); }
    .live[aria-pressed="true"]::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: #e5534b; vertical-align: 1px; animation: beat 1.4s ease-in-out infinite; }

    /* --legend-h: the open legend's height, so the end of the page can still scroll out from under it. */
    .wrap { max-width: 1240px; margin: 0 auto; padding: 16px 18px calc(80px + var(--legend-h, 0px)); }
    .graph { position: relative; }
    .lanes { position: absolute; left: 0; top: 0; z-index: 4; overflow: visible; pointer-events: none; }
    /* Marks of rows that slide down while others rise past them: under the rising rows (z 3), over their own (z 1). */
    .lanes.sunk { z-index: 2; }
    /* The band's background is a layer of its own, so when rows come or go it trails them (--lag) instead of jumping. */
    .now { position: relative; border-radius: 12px; }
    .now::before { content: ""; position: absolute; inset: 0 0 var(--lag, 0px); border-radius: inherit; background: var(--now); box-shadow: inset 0 0 0 1px var(--line); pointer-events: none; }
    .row { position: relative; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 calc(var(--gx) + 2px); border-radius: 8px; font-size: 13px; }
    /* Row highlights are image layers, which leaves background-color free for .moving below. */
    .row.is-waiting { background: linear-gradient(90deg, rgba(240,181,74,.075), transparent 55%); }
    .row:hover { background-image: linear-gradient(var(--hover), var(--hover)); }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .l1, .l2 { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
    .who { font-weight: 600; }
    .role { padding: 1px 5px; border-radius: 5px; font-size: 11px; color: var(--secondary); background: rgba(255,255,255,.06); }
    .state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; flex-shrink: 0; }
    .state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .state em { font-style: normal; color: var(--muted); }
    .state.waiting { color: var(--waiting); }
    .state.done { color: var(--done); }
    .task, .msg, .act, .ask { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .task { color: var(--secondary); }
    .act { font: 11.5px/1.3 var(--mono); color: var(--muted); }
    .ask { font-size: 12px; color: var(--waiting); }
    .l2 .btn { margin-left: 2px; }
    .btn { flex-shrink: 0; height: 22px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 500; background: rgba(255,255,255,.07); }
    .btn:hover { background: rgba(255,255,255,.12); }
    .btn.allow { background: var(--waiting); color: #1d1606; }
    .btn.merge { background: var(--done); color: #0d1a10; }
    .btn.allow:hover, .btn.merge:hover { filter: brightness(1.08); }
    .btn[aria-disabled="true"] { opacity: .4; cursor: default; filter: none; }
    .meta { display: flex; align-items: center; gap: 10px; flex-shrink: 0; font-size: 12px; color: var(--muted); }
    .pill { display: inline-flex; align-items: center; flex-shrink: 0; height: 19px; padding: 0 7px; border-radius: 6px; font: 500 11.5px var(--mono); color: color-mix(in srgb, var(--c) 78%, white); background: color-mix(in srgb, var(--c) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 28%, transparent); }
    .pill.tag { color: var(--secondary); background: none; box-shadow: inset 0 0 0 1px var(--line); }
    .pill svg { width: 11px; height: 11px; margin: 0 4px 0 -1px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
    .wt, .behind, .pr, .diff { display: inline-flex; align-items: center; gap: 4px; font: 11.5px var(--mono); }
    .wt svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
    .pr { color: var(--secondary); }
    .add { color: var(--done); }
    .del { color: var(--del); }
    .tree { flex-shrink: 0; width: 9px; height: 9px; margin: -7px 0 0 4px; border-left: 1.5px solid rgba(255,255,255,.16); border-bottom: 1.5px solid rgba(255,255,255,.16); border-bottom-left-radius: 4px; }
    .sub-name { flex-shrink: 0; font-size: 12.5px; font-weight: 500; }
    .sub .act { font-size: 11px; }
    .author { display: grid; place-items: center; flex-shrink: 0; width: 20px; }
    .av { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; background: color-mix(in srgb, var(--c) 16%, transparent); }
    .av svg { width: 14px; height: 14px; }
    .av.human { border-radius: 50%; background: #34383f; color: #d4d7dc; font-size: 10px; font-weight: 600; }
    .time { flex-shrink: 0; width: 38px; text-align: right; font-size: 12px; color: var(--muted); }
    .sha { flex-shrink: 0; width: 58px; font: 11.5px var(--mono); color: var(--muted); }
    .gl-codex { font-family: var(--mono); font-weight: 700; letter-spacing: -.04em; }
    .gl-pi { font-family: "Iowan Old Style", "Times New Roman", serif; font-weight: 600; }
    .gl-human { font-weight: 600; }

    /* Projects. 全部 puts them side by side, one column each, and scrolls sideways when they do not fit. */
    .wrap.cols { max-width: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(420px, 1fr); gap: 20px; align-items: start; overflow-x: auto; scroll-padding: 0 18px; }
    .project { min-width: 0; container: project / inline-size; }
    .main { container: text / inline-size; }
    .phead { display: flex; align-items: center; gap: 10px; height: 28px; margin-bottom: 8px; padding: 0 14px 0 4px; white-space: nowrap; }
    .pname { flex-shrink: 0; font-size: 14px; font-weight: 600; }
    button.pname:hover { text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
    .ppath { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 11.5px var(--mono); color: var(--muted); }
    .pstats { display: flex; flex-shrink: 0; gap: 12px; margin-left: auto; font-size: 12px; color: var(--muted); }
    .pstats span { display: inline-flex; align-items: center; gap: 5px; }
    .pstats i { width: 6px; height: 6px; border-radius: 50%; }
    .pnew { display: inline-flex; flex-shrink: 0; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 7px; border-radius: 7px; font-size: 12px; color: var(--secondary); box-shadow: inset 0 0 0 1px var(--line); }
    .pnew:hover { color: var(--text); background: var(--hover); }
    .pnew svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
    .row.more { gap: 10px; font-size: 12px; color: var(--muted); }
    .row.more:hover { background-image: none; }
    .link { font-size: 12px; color: var(--secondary); }
    .link:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }

    /* Worktree rows head each group of agents in the "now" band. */
    .now .wt-row:not(:first-child)::before { content: ""; position: absolute; top: 0; left: calc(var(--gx) + 2px); right: 14px; height: 1px; background: var(--line); }
    .wt-name { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; font: 500 12px var(--mono); color: var(--secondary); }
    .wt-name svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
    .wt-row.is-merged .wt-name { color: var(--muted); }
    .clean, .idle { font-size: 12px; color: var(--muted); }
    .pill > span, .wt-name > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Narrow project columns: drop the sha and path labels; branch pills shorten with an ellipsis, worktree names never do. */
    @container project (max-width: 640px) {
      .sha, .wt { display: none; }
      .l1 { overflow: hidden; }
      /* Shrink factor 1, not less: below 1 flexbox only absorbs part of the overflow. */
      .l1 .pill { flex-shrink: 1; min-width: 0; }
      /* In commit rows the message gives way instead; a long branch pill is capped at half the line. */
      .commit .l1 .pill { flex-shrink: 0; max-width: 50%; }
      .meta .pill { max-width: 150px; }
      .row.agent .meta { flex-shrink: 1; min-width: 0; overflow: hidden; }
    }
    /* A worktree row whose text column is very narrow drops the PR number and behind-main count first. */
    @container text (max-width: 250px) {
      .wt-row .pr, .wt-row .behind { display: none; }
    }

    /* Conversation panel: the graph stays the main view; picking an agent opens its transcript and a prompt box on the right. */
    :root { --panel-w: clamp(360px, 30vw, 460px); }
    body.chatting .stage { padding-right: var(--panel-w); }
    .row { scroll-margin: 64px 0 16px; }
    .row.agent[data-a], .row.sub { cursor: pointer; }
    .row.sel, .row.sel:hover { background-image: linear-gradient(rgba(255,255,255,.075), rgba(255,255,255,.075)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
    .row.spot { background-image: linear-gradient(rgba(142,167,239,.15), rgba(142,167,239,.15)); }
    .panel { position: fixed; z-index: 9; top: 52px; right: 0; bottom: 0; width: var(--panel-w); display: flex; flex-direction: column; background: #131619; border-left: 1px solid var(--line); }
    .panel[hidden], .panel [hidden] { display: none; }
    .ph { flex-shrink: 0; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line); }
    .ph1 { display: flex; align-items: center; gap: 8px; height: 26px; min-width: 0; font-size: 13px; white-space: nowrap; }
    .x { display: grid; place-items: center; flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px; color: var(--muted); }
    .x:hover { color: var(--text); background: var(--hover); }
    .x svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
    .ph1 .x { margin-left: auto; }
    .back { flex-shrink: 0; height: 24px; margin-left: -6px; padding: 0 6px; border-radius: 6px; color: var(--secondary); }
    .back:hover { color: var(--text); background: var(--hover); }
    .crumb { color: var(--muted); }
    .ph-task { margin: 6px 24px 0 0; font-size: 14.5px; font-weight: 600; line-height: 1.45; }
    .ph-ctx { display: flex; align-items: center; gap: 8px; min-width: 0; margin-top: 8px; overflow: hidden; font-size: 12px; color: var(--muted); white-space: nowrap; }
    .ph-ctx .pill { flex-shrink: 1; min-width: 0; }
    .msgs { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px; overflow-y: auto; overscroll-behavior: contain; }
    .m { flex-shrink: 0; min-width: 0; font-size: 13px; line-height: 1.6; }
    .m.user { align-self: flex-end; max-width: 88%; }
    .m.user.from { align-self: stretch; max-width: none; }
    .bubble { padding: 8px 12px; border-radius: 12px 12px 4px 12px; background: rgba(255,255,255,.075); white-space: pre-wrap; overflow-wrap: anywhere; }
    .m.from .bubble { border-radius: 4px 12px 12px 12px; background: rgba(255,255,255,.035); box-shadow: inset 0 0 0 1px var(--line); }
    .from-l { margin-bottom: 4px; font-size: 11.5px; color: var(--muted); }
    .m.text { color: #d9dbdf; white-space: pre-wrap; overflow-wrap: anywhere; }
    .m.tool { display: flex; align-items: baseline; gap: 8px; font: 11.5px/1.5 var(--mono); color: var(--muted); }
    .m.tool + .m.tool { margin-top: -8px; }
    .m.tool::before { content: ""; align-self: center; flex-shrink: 0; width: 5px; height: 5px; margin: 0 2px; border-radius: 50%; background: #454a52; }
    .m.tool.live::before { width: 9px; height: 9px; margin: 0; border: 1.5px solid var(--c); border-right-color: transparent; background: none; animation: spin .9s linear infinite; }
    .m.tool .tn { flex-shrink: 0; color: var(--secondary); }
    .m.tool .ta { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .m.tool .to { flex-shrink: 0; }
    .m.commit, .m.spawn { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; text-align: left; box-shadow: inset 0 0 0 1px var(--line); }
    .m.commit:hover, .m.spawn:hover { background: var(--hover); }
    .m.commit i { flex-shrink: 0; width: 7px; height: 7px; border-radius: 50%; }
    .m .lbl { flex-shrink: 0; font-size: 11.5px; color: var(--muted); }
    .m .cmsg, .m .sact { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .m .csha, .m .sact { font: 11.5px var(--mono); color: var(--muted); }
    .m .csha, .m .chev { flex-shrink: 0; color: var(--muted); }
    .m.ask { padding: 10px 12px; border-radius: 10px; background: rgba(240,181,74,.07); box-shadow: inset 0 0 0 1px rgba(240,181,74,.24); }
    .m.ask .ask-t { font-size: 12.5px; color: var(--waiting); }
    .m.ask code { display: block; margin-top: 4px; font: 12px/1.5 var(--mono); overflow-wrap: anywhere; }
    .m.ask .ask-b { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .m.ask.resolved { background: none; box-shadow: inset 0 0 0 1px var(--line); }
    .m.ask.resolved .ask-t { color: var(--secondary); }
    .m .res { font-size: 12px; color: var(--muted); }
    .m.note { align-self: center; font-size: 12px; color: var(--muted); }
    .composer { flex-shrink: 0; margin: 0 12px 12px; padding: 10px 8px 8px 12px; border-radius: 12px; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
    .composer:focus-within { box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
    .composer textarea { display: block; width: 100%; min-height: 21px; max-height: 168px; padding: 0 4px 0 0; border: 0; outline: 0; resize: none; background: none; color: var(--text); font: inherit; font-size: 13px; line-height: 1.6; }
    .composer textarea::placeholder { color: var(--muted); }
    .cbar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .cbar .hint { font-size: 11px; color: var(--muted); }
    .send { display: grid; place-items: center; width: 28px; height: 28px; margin-left: auto; border-radius: 8px; color: #101215; background: var(--text); }
    .send:disabled { opacity: .22; cursor: default; }
    .send svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ended { flex-shrink: 0; display: flex; align-items: center; gap: 10px; margin: 0 12px 12px; padding: 12px 14px; border-radius: 12px; font-size: 12.5px; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }

    /* 改动 tab: what the worktree's branch changes against main, the review on it, and the merge decision under it. */
    .tabs { display: flex; gap: 4px; margin: 6px 0 -12px -8px; }
    .tab { position: relative; height: 34px; padding: 0 8px; font-size: 12.5px; color: var(--muted); }
    .tab:hover { color: var(--secondary); }
    .tab[aria-selected="true"] { color: var(--text); }
    .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 1px; background: var(--text); }
    .tab .n { margin-left: 5px; font: 11px var(--mono); color: var(--muted); }
    .tab .flag { display: inline-block; width: 6px; height: 6px; margin-left: 5px; border-radius: 50%; background: var(--waiting); vertical-align: 1px; }
    .review { gap: 14px; }
    .review > * { flex-shrink: 0; }
    .rv-sum { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; color: var(--secondary); white-space: nowrap; }
    .rv-sum .base { min-width: 0; margin-left: auto; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--muted); }
    .rv-h { margin-bottom: 6px; font-size: 11.5px; color: var(--muted); }
    .rv-empty { font-size: 12.5px; color: var(--muted); }
    .rv-box { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; box-shadow: inset 0 0 0 1px var(--line); }
    .rv-rev { background: rgba(126,170,255,.045); box-shadow: inset 0 0 0 1px rgba(126,170,255,.2); }
    .rv-bh { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; white-space: nowrap; }
    .rv-n { margin-left: auto; font-size: 12px; color: var(--muted); }
